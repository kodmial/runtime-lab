name: Bootstrap secret permission test

on:
  push:
    paths:
      - '.github/workflows/bootstrap-secret-test.yml'

permissions:
  actions: write
  contents: read

jobs:
  test-secret-write:
    runs-on: ubuntu-latest
    steps:
      - name: Attempt to create harmless test secret
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh secret set __BOOTSTRAP_TEST --repo "$GITHUB_REPOSITORY" --body "test"
