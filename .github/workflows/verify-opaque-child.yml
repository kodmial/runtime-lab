name: Verify opaque delegated relationship

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Continuum verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kodmial/continuum
          ref: main
          path: .continuum-engine
          persist-credentials: false

      - name: Resolve and verify opaque child
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          TARGET_CHILD_ID: child-a
        run: |
          set -euo pipefail
          export CONTINUUM_ENGINE_ROOT="$PWD/.continuum-engine"
          resolver="$CONTINUUM_ENGINE_ROOT/.github/scripts/delegation_repository.sh"

          set +e
          child_repo="$(PARENT_CONFIG=.continuum.yml CHILD_REPOSITORIES="" bash "$resolver" resolve "$TARGET_CHILD_ID" 2>/dev/null)"
          resolve_rc=$?
          set -e
          [[ "$resolve_rc" -eq 0 && -n "$child_repo" ]] || {
            echo "::error::Opaque child resolution failed with rc=$resolve_rc."
            exit "$resolve_rc"
          }

          PARENT_CONFIG=.continuum.yml CHILD_REPOSITORIES=""             bash "$resolver" verify "$TARGET_CHILD_ID" "$child_repo" >/dev/null 2>&1 || {
              echo "::error::Opaque child verification failed."
              exit 2
            }

          echo "Opaque delegated relationship resolves and verifies successfully."
