name: OpenCode watchdog

on:
  # GitHub matches this filter on the watched workflow's `name:` VALUE, never
  # on its file name. `OpenCode agent` is the `name:` of the OpenCode caller
  # (continuum-opencode.yml). Renaming that `name:` silently disables this
  # watchdog: no recovery runs will be delivered any more.
  workflow_run:
    workflows: ["OpenCode agent"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  call:
    uses: kodmial/continuum/.github/workflows/continuum-opencode-watchdog.yml@main
    secrets: inherit
    with:
      continuum_ref: main
      watched_workflow: "OpenCode agent"