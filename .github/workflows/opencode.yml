name: OpenCode agent

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      mode:
        description: "Invocation mode: issue, resolve-conflict, ci-fix"
        required: true
        type: string
      issue_number:
        description: "Issue number for issue mode"
        required: false
        type: string
      pr_number:
        description: "Pull request number for repair modes"
        required: false
        type: string
      head_ref:
        description: "Pull request head branch for repair modes"
        required: false
        type: string
      run_id:
        description: "Failed CI workflow run id"
        required: false
        type: string

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: opencode-${{ inputs.issue_number || inputs.pr_number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  opencode:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       contains(fromJSON('["issue","resolve-conflict","ci-fix"]'), inputs.mode)) ||
      (github.event_name == 'issue_comment' &&
       !github.event.issue.pull_request &&
       github.actor == github.repository_owner &&
       (contains(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, '/opencode')))
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          token: ${{ secrets.TAP_PAT || github.token }}
          persist-credentials: true
          ref: ${{ inputs.head_ref || 'main' }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install OpenCode CLI
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            echo "OpenCode install attempt $attempt/3"
            if curl -fsSL https://opencode.ai/install | bash; then
              break
            fi

            if [[ "$attempt" == "3" ]]; then
              echo "::error::OpenCode installer failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 5))
          done

          test -x "$HOME/.opencode/bin/opencode"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Implement issue
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.mode == 'issue') ||
          github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT || github.token }}
          GITHUB_TOKEN: ${{ secrets.TAP_PAT || github.token }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          OPENCODE_CONFIG_CONTENT: >-
            {"permission":{"bash":{"*":"allow","git *":"deny","git status":"allow","git status *":"allow","git diff":"allow","git diff *":"allow","git log":"allow","git log *":"allow","git show":"allow","git show *":"allow","git rev-parse *":"allow","git ls-files":"allow","git ls-files *":"allow","git grep *":"allow","git blame *":"allow","git branch --show-current":"allow","git remote -v":"allow"}}}
        shell: bash
        run: |
          set -euo pipefail

          ISSUE_NUMBER="${INPUT_ISSUE_NUMBER:-${EVENT_ISSUE_NUMBER:-}}"
          [[ -n "$ISSUE_NUMBER" ]] || { echo "::error::Missing issue number"; exit 1; }

          ISSUE_JSON="$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json title,body,url)"
          ISSUE_TITLE="$(jq -r .title <<<"$ISSUE_JSON")"
          ISSUE_BODY="$(jq -r '.body // ""' <<<"$ISSUE_JSON")"

          git fetch origin main --quiet
          git switch --detach origin/main
          BRANCH="opencode/issue${ISSUE_NUMBER}-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"

          PROMPT="$(cat <<EOF
          Implement GitHub issue #${ISSUE_NUMBER} completely.

          Title:
          ${ISSUE_TITLE}

          Specification:
          ${ISSUE_BODY}

          Requirements:
          - Treat the issue body and Definition of Done as authoritative.
          - Inspect the existing repository before changing code.
          - Implement the complete task, not a partial sketch.
          - Add or update automated tests when appropriate.
          - Run the relevant local checks when practical.
          - Keep all comments and commit-facing text in English.
          - Do not add unrelated automation outside the issue scope.
          - Do not modify .github/workflows/**. Stable workflow envelopes are provisioned separately because the Actions token cannot push workflow-file changes; put mutable automation logic under automation/ or normal source files.
          - Do not perform git commits, pushes, branch switches, rebases, resets, or PR creation; the workflow owns Git state.
          EOF
          )"

          opencode run --auto --model "$OPENCODE_MODEL" "$PROMPT"

          CURRENT_BRANCH="$(git branch --show-current)"
          if [[ "$CURRENT_BRANCH" != "$BRANCH" ]]; then
            echo "::error::OpenCode changed branch unexpectedly: expected '$BRANCH', got '$CURRENT_BRANCH'."
            exit 1
          fi

          if [[ -n "$(git status --porcelain -- .github/workflows)" ]]; then
            echo "::error::OpenCode modified .github/workflows/**, which this token cannot safely push."
            git status --short -- .github/workflows
            exit 1
          fi

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "OpenCode produced no repository changes."
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"               --body "Automation produced no code changes; pausing this issue for manual inspection."
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"               --add-label "automation:paused" --remove-label "automation:in-progress" || true
            exit 0
          fi

          git add -A
          git commit -m "fix: implement issue #${ISSUE_NUMBER}"

          # main can advance while OpenCode is working. Rebase the task-only
          # commit onto the latest main before publishing so creating the
          # issue branch cannot be interpreted as changing protected workflow
          # files that were updated on main in the meantime.
          sync_and_verify_branch() {
            git fetch origin main --quiet
            git rebase origin/main

            if [[ -n "$(git diff --name-only origin/main...HEAD -- .github/workflows)" ]]; then
              echo "::error::Issue branch differs from current main under .github/workflows/**."
              git diff --name-status origin/main...HEAD -- .github/workflows
              exit 1
            fi
          }

          sync_and_verify_branch
          if ! git push -u origin "$BRANCH"; then
            echo "Initial push failed; refreshing main and retrying once."
            sync_and_verify_branch
            git push -u origin "$BRANCH"
          fi

          PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state all             --json number --jq '.[0].number // empty')"
          if [[ -z "$PR_NUMBER" ]]; then
            PR_URL="$(gh pr create               --repo "$GITHUB_REPOSITORY"               --base main               --head "$BRANCH"               --title "$ISSUE_TITLE"               --body "Automated implementation for #${ISSUE_NUMBER}.\n\nCloses #${ISSUE_NUMBER}")"
            PR_NUMBER="$(gh pr view "$PR_URL" --repo "$GITHUB_REPOSITORY" --json number --jq .number)"
          fi

          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main -f "pr_number=$PR_NUMBER"
          echo "Created/updated PR #$PR_NUMBER and dispatched CI."

      - name: Resolve merge conflict with main
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'resolve-conflict'
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT || github.token }}
          GITHUB_TOKEN: ${{ secrets.TAP_PAT || github.token }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_REF: ${{ inputs.head_ref }}
          OPENCODE_CONFIG_CONTENT: >-
            {"permission":{"bash":{"*":"allow","git *":"deny","git status":"allow","git status *":"allow","git diff":"allow","git diff *":"allow","git log":"allow","git log *":"allow","git show":"allow","git show *":"allow","git rev-parse *":"allow","git ls-files":"allow","git ls-files *":"allow","git grep *":"allow","git blame *":"allow"}}}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$PR_NUMBER" && -n "$HEAD_REF" ]] || { echo "::error::Missing PR repair inputs"; exit 1; }

          git fetch origin main "$HEAD_REF" --quiet
          git switch "$HEAD_REF"

          set +e
          git merge --no-commit --no-ff origin/main
          MERGE_STATUS=$?
          set -e

          if [[ -z "$(git diff --name-only --diff-filter=U)" ]]; then
            if git rev-parse -q --verify MERGE_HEAD >/dev/null 2>&1; then
              git commit -m "chore: sync main into PR #${PR_NUMBER}"
              git push origin "HEAD:$HEAD_REF"
              echo "Main merged cleanly into PR branch."
            elif [[ "$MERGE_STATUS" -ne 0 ]]; then
              echo "::error::Merge failed without resolvable conflict files."
              exit "$MERGE_STATUS"
            else
              echo "PR branch already contains current main."
            fi

            gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main -f "pr_number=$PR_NUMBER"
            exit 0
          fi

          PROMPT="$(cat <<EOF
          Resolve all merge conflicts currently present in this checkout for pull request #${PR_NUMBER}.

          Requirements:
          - Preserve the intended behavior from both the PR and current main.
          - Resolve every conflict marker without discarding unrelated changes.
          - Do not run git commit, push, branch, reset, rebase, merge, or PR commands; the workflow owns Git state.
          - Run relevant tests or validation when practical.
          - Keep comments in English.
          EOF
          )"
          opencode run --auto --model "$OPENCODE_MODEL" "$PROMPT"

          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo "::error::Unresolved merge conflicts remain."
            exit 1
          fi

          git add -A
          git commit -m "chore: resolve main conflict for PR #${PR_NUMBER}"
          git push origin "HEAD:$HEAD_REF"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main -f "pr_number=$PR_NUMBER"

      - name: Fix failed CI
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'ci-fix'
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT || github.token }}
          GITHUB_TOKEN: ${{ secrets.TAP_PAT || github.token }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}
          PR_NUMBER: ${{ inputs.pr_number }}
          RUN_ID: ${{ inputs.run_id }}
          HEAD_REF: ${{ inputs.head_ref }}
          OPENCODE_CONFIG_CONTENT: >-
            {"permission":{"bash":{"*":"allow","git *":"deny","git status":"allow","git status *":"allow","git diff":"allow","git diff *":"allow","git log":"allow","git log *":"allow","git show":"allow","git show *":"allow","git rev-parse *":"allow","git ls-files":"allow","git ls-files *":"allow","git grep *":"allow","git blame *":"allow","git branch --show-current":"allow"}}}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$PR_NUMBER" && -n "$HEAD_REF" && -n "$RUN_ID" ]] || {
            echo "::error::Missing CI repair inputs"; exit 1;
          }

          git fetch origin "$HEAD_REF" --quiet
          git switch "$HEAD_REF"
          BEFORE_SHA="$(git rev-parse HEAD)"
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/failed-ci.log 2>&1 || true
          LOG_TAIL="$(tail -n 500 /tmp/failed-ci.log)"

          PROMPT="$(cat <<EOF
          Fix the failed CI for pull request #${PR_NUMBER}.

          Failed workflow run id: ${RUN_ID}

          Relevant failed-job log tail:
          ${LOG_TAIL}

          Requirements:
          - Identify and fix the concrete root cause.
          - Keep the change scoped to the failure.
          - If the failure is clearly transient infrastructure and no code change is justified, leave the repository unchanged.
          - Do not perform git commits, pushes, branch switches, rebases, resets, merges, or PR creation; the workflow owns Git state.
          - Run the relevant checks locally when practical.
          - Keep comments in English.
          EOF
          )"
          opencode run --auto --model "$OPENCODE_MODEL" "$PROMPT"

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No code change produced; rerunning the failed CI once."
            gh run rerun "$RUN_ID" --repo "$GITHUB_REPOSITORY" --failed
            exit 0
          fi

          git add -A
          git commit -m "fix: repair CI for PR #${PR_NUMBER}"
          git push origin "HEAD:$HEAD_REF"

          # A GITHUB_TOKEN push may not emit pull_request_target/synchronize,
          # so clear the per-head repair lock explicitly before validating the new head.
          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/opencode-ci-repair" \
            >/dev/null 2>&1 || true

          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main -f "pr_number=$PR_NUMBER"

      - name: Clear conflict repair lock
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'resolve-conflict'
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT || github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          gh api --method DELETE             "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/opencode-conflict-repair"             >/dev/null 2>&1 || true

      - name: Release failed issue reservation
        if: failure() && github.event_name == 'workflow_dispatch' && inputs.mode == 'issue'
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT || github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$ISSUE_NUMBER" ]] || exit 0

          marker='<!-- runtime-lab-scheduler-dispatch -->'
          attempts="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            --jq "[.[] | select((.body // \"\") | contains(\"$marker\"))] | length" \
            | awk '{s+=$1} END {print s+0}')"

          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --remove-label "automation:in-progress" >/dev/null 2>&1 || true

          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "OpenCode workflow run $GITHUB_RUN_ID failed before a usable PR was completed. Dispatch attempts recorded: $attempts."

          max_attempts=4
          if (( attempts >= max_attempts )); then
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --add-label "automation:paused" >/dev/null 2>&1 || true
            echo "Issue #$ISSUE_NUMBER paused after $attempts failed dispatch attempts."
          else
            gh workflow run issue-scheduler.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo "Released issue #$ISSUE_NUMBER and requested scheduler retry."
          fi

