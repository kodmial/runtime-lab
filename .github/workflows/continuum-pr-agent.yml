name: PR Agent (OpenCode backend)

run-name: >-
  PR-Agent PR #${{ inputs.pr_number || github.event.issue.number || 'unknown' }}
  [${{ inputs.recovery_kind || 'review' }}:${{ inputs.retry_attempt || '0' }}]
  head=${{ inputs.expected_head_sha || 'event' }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number for a bounded PR-Agent retry
        required: false
        type: string
      continuum_ref:
        description: Continuum revision used by delegated retries
        required: false
        default: main
        type: string
      target_child_id:
        description: Opaque verified child id for delegated PR-Agent execution
        required: false
        type: string
      expected_head_sha:
        description: Exact PR HEAD the retry is allowed to review
        required: false
        type: string
      retry_attempt:
        description: Bounded retry attempt number
        required: false
        default: '0'
        type: string
      retry_workflow:
        description: Caller workflow filename used for isolated PR-Agent retries
        required: false
        type: string
      recovery_kind:
        description: Recovery operation identity for bounded automatic retries
        required: false
        default: review
        type: choice
        options:
          - review
          - repair

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  statuses: write

# No caller-level concurrency by design (issue #227): the caller must never
# serialize per PR before the reusable operation layer admits exact-HEAD
# work. A per-PR caller lock would queue no-op comment runs ahead of
# useful reviews. The single authoritative serialization lives in
# continuum-pr-agent.yml (serialized review without preemption) and
# continuum-pr-agent-repair.yml (non-cancellable repair publication).

jobs:
  call:
    if: github.event_name == 'workflow_dispatch'
    uses: kodmial/continuum/.github/workflows/continuum-pr-agent.yml@main
    secrets: inherit
    with:
      continuum_ref: "${{ inputs.continuum_ref || 'main' }}"
      pr_number: "${{ inputs.pr_number }}"
      target_child_id: "${{ inputs.target_child_id }}"
      expected_head_sha: "${{ inputs.expected_head_sha }}"
      retry_attempt: "${{ inputs.retry_attempt }}"
      retry_workflow: "${{ inputs.retry_workflow }}"
      recovery_kind: "${{ inputs.recovery_kind || 'review' }}"

