name: Auto-merge CI-green OpenCode pull requests

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  statuses: read

concurrency:
  group: runtime-lab-auto-merge
  cancel-in-progress: true

jobs:
  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Reconcile OpenCode pull requests
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repoFullName = `${owner}/${repo}`;
            const noAutoMerge = 'no-auto-merge';
            const conflictLock = 'opencode-conflict-repair';
            const ciContext = 'runtime-lab/ci';

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.createLabel({owner, repo, name, color, description});
              } catch (err) {
                if (err.status !== 422) throw err;
              }
            }

            await ensureLabel(noAutoMerge, 'B60205', 'Do not automatically merge this pull request.');
            await ensureLabel(
              conflictLock,
              'B60205',
              'One automatic OpenCode conflict-repair attempt per conflict episode.'
            );

            function hasLabel(pr, name) {
              return (pr.labels || []).some(label => label.name === name);
            }

            async function getPr(number) {
              const {data} = await github.rest.pulls.get({
                owner, repo, pull_number: number,
              });
              return data;
            }

            async function dispatchCi(pr) {
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: 'ci.yml',
                ref: 'main',
                inputs: {pr_number: String(pr.number)},
              });
              core.notice(`PR #${pr.number}: dispatched CI for head ${pr.head.sha}.`);
            }

            async function dispatchConflictRepair(pr) {
              if (hasLabel(pr, conflictLock)) {
                core.info(`PR #${pr.number}: conflict repair is already in progress/attempted.`);
                return;
              }

              const issueMatch = (pr.head.ref || '').match(/^opencode\/issue(\d+)-/);
              if (!issueMatch) {
                core.warning(`PR #${pr.number}: cannot map conflict repair to a source issue.`);
                return;
              }
              const issueNumber = Number(issueMatch[1]);

              // Do not locally merge main into an existing PR branch and push it.
              // If main contains workflow-file changes, that push would require
              // the GitHub App Workflows permission. Freeze this PR and rerun
              // the issue from current main; issue-mode publishing creates a
              // fresh remote ref from the current main SHA and replays only
              // ordinary task changes.
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pr.number,
                labels: [conflictLock, noAutoMerge],
              });
              try {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pr.number,
                  body:
                    'Automatic merge conflict detected. This PR is frozen; ' +
                    'the source issue will be regenerated from current main ' +
                    'using the refs-first publication path.',
                });
                await github.rest.actions.createWorkflowDispatch({
                  owner,
                  repo,
                  workflow_id: 'opencode.yml',
                  ref: 'main',
                  inputs: {
                    mode: 'issue',
                    issue_number: String(issueNumber),
                  },
                });
                core.notice(
                  `PR #${pr.number}: rerunning issue #${issueNumber} from current main.`
                );
              } catch (err) {
                try {
                  await github.rest.issues.removeLabel({
                    owner, repo, issue_number: pr.number, name: conflictLock,
                  });
                } catch (_) {}
                throw err;
              }
            }

            async function latestCiStatus(sha) {
              const {data} = await github.rest.repos.getCombinedStatusForRef({
                owner, repo, ref: sha,
              });
              return (data.statuses || [])
                .filter(status => status.context === ciContext)
                .sort((a, b) =>
                  new Date(b.updated_at || b.created_at).getTime() -
                  new Date(a.updated_at || a.created_at).getTime()
                )[0] || null;
            }

            async function syncWithMain(pr) {
              const {data: comparison} = await github.request(
                'GET /repos/{owner}/{repo}/compare/{basehead}',
                {owner, repo, basehead: `main...${pr.head.sha}`}
              );
              if ((comparison.behind_by || 0) <= 0) return {updated: false, conflict: false};

              const oldHead = pr.head.sha;
              try {
                await github.rest.pulls.updateBranch({
                  owner,
                  repo,
                  pull_number: pr.number,
                  expected_head_sha: oldHead,
                });
              } catch (err) {
                if (err.status !== 422 && err.status !== 409) throw err;

                core.info(
                  `PR #${pr.number}: updateBranch unavailable/refused; ` +
                  'falling back to merging current main into the PR branch.'
                );

                try {
                  await github.rest.repos.merge({
                    owner,
                    repo,
                    base: pr.head.ref,
                    head: 'main',
                    commit_message: `chore: sync main into PR #${pr.number}`,
                  });
                } catch (mergeErr) {
                  if (mergeErr.status === 409 || mergeErr.status === 422) {
                    await dispatchConflictRepair(pr);
                    return {updated: false, conflict: true};
                  }
                  throw mergeErr;
                }
              }

              let fresh = pr;
              for (let i = 0; i < 12; i++) {
                await new Promise(resolve => setTimeout(resolve, 2000));
                fresh = await getPr(pr.number);
                if (fresh.head.sha !== oldHead) break;
              }

              if (fresh.head.sha === oldHead) {
                core.info(`PR #${pr.number}: branch update accepted but new head is not visible yet.`);
                return {updated: true, conflict: false};
              }

              try {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: pr.number, name: conflictLock,
                });
              } catch (err) {
                if (err.status !== 404) throw err;
              }

              await dispatchCi(fresh);
              return {updated: true, conflict: false};
            }

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base: 'main', per_page: 100,
            });

            const candidates = pulls
              .filter(pr =>
                !pr.draft &&
                pr.head.repo?.full_name === repoFullName &&
                /^opencode\/issue\d+-/.test(pr.head.ref)
              )
              .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

            for (const listed of candidates) {
              let pr = await getPr(listed.number);
              if (hasLabel(pr, noAutoMerge)) {
                core.info(`PR #${pr.number}: blocked by ${noAutoMerge}.`);
                continue;
              }

              const sync = await syncWithMain(pr);
              if (sync.updated || sync.conflict) continue;

              pr = await getPr(pr.number);
              const ci = await latestCiStatus(pr.head.sha);
              if (!ci) {
                await dispatchCi(pr);
                continue;
              }
              if (ci.state === 'pending') {
                core.info(`PR #${pr.number}: CI is still pending.`);
                continue;
              }
              if (ci.state !== 'success') {
                core.info(`PR #${pr.number}: CI is ${ci.state}; waiting for repair.`);
                continue;
              }

              if (pr.mergeable === false || pr.mergeable_state === 'dirty') {
                await dispatchConflictRepair(pr);
                continue;
              }
              if (pr.mergeable === null) {
                core.info(`PR #${pr.number}: GitHub is still computing mergeability.`);
                continue;
              }

              // Revalidate the exact head and CI status immediately before merge.
              pr = await getPr(pr.number);
              if (
                pr.state !== 'open' ||
                pr.draft ||
                pr.head.repo?.full_name !== repoFullName ||
                !/^opencode\/issue\d+-/.test(pr.head.ref) ||
                hasLabel(pr, noAutoMerge)
              ) {
                continue;
              }
              const finalCi = await latestCiStatus(pr.head.sha);
              if (!finalCi || finalCi.state !== 'success') {
                core.info(`PR #${pr.number}: CI gate changed before merge.`);
                continue;
              }

              const {data: result} = await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: pr.number,
                merge_method: 'squash',
                commit_title: pr.title,
                sha: pr.head.sha,
              });
              if (!result.merged) {
                core.warning(`PR #${pr.number}: merge refused: ${result.message || 'unknown reason'}`);
                continue;
              }

              const issueMatch = pr.head.ref.match(/^opencode\/issue(\d+)-/);
              if (issueMatch) {
                const issueNumber = Number(issueMatch[1]);
                try {
                  await github.rest.issues.update({
                    owner, repo, issue_number: issueNumber,
                    state: 'closed', state_reason: 'completed',
                  });
                } catch (_) {}
                for (const label of ['automation:in-progress', 'automation:paused']) {
                  try {
                    await github.rest.issues.removeLabel({
                      owner, repo, issue_number: issueNumber, name: label,
                    });
                  } catch (err) {
                    if (err.status !== 404) throw err;
                  }
                }
              }

              core.notice(`PR #${pr.number}: auto-merged CI-green head ${pr.head.sha}.`);

              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id: 'issue-scheduler.yml', ref: 'main',
              });
              break;
            }
