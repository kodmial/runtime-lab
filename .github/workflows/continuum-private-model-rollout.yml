name: Qualify private Child models on Parent

# Trusted parent-side rollout: private Child Actions cannot allocate runners.
# Owner-approved private enrollment was reconciled via its idempotent workflow.
# Never put Child IDs/repository names into this public workflow or run-name.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/continuum-private-model-rollout.yml'
      - 'automation/private_model_api.py'
      - 'automation/private_model_receipt.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: continuum-private-model-rollout
  cancel-in-progress: false

jobs:
  provision-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      count: ${{ steps.run.outputs.count }}
      sealed: ${{ steps.run.outputs.sealed }}
    steps:
      - name: Checkout canonical Continuum runtime and private child resolver
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kodmial/continuum
          ref: main
          path: .continuum-engine
          persist-credentials: false
      - name: Checkout audited Parent rollout helpers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: .parent-rollout
          persist-credentials: false
      - name: Restore verified cached official OpenCode
        id: toolchain
        uses: kodmial/continuum/.github/actions/agent-toolchain@main
        with:
          components: opencode
          opencode-version: ${{ vars.CONTINUUM_OPENCODE_VERSION || '' }}
      - name: Check GitHub PAT API budget before private discovery
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "::error::Parent TAP_PAT missing"; exit 2; }
          python3 .parent-rollout/automation/private_model_api.py rate-budget
      - name: Provision and qualify registered private Children without revealing names
        id: run
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          CONTINUUM_APPROVED_MODELS: ${{ vars.OPENCODE_MODELS }}
          CONTINUUM_EXPECTED_TARGETS: ${{ vars.CONTINUUM_PRIVATE_ROLLOUT_TARGETS || '2' }}
          CHILD_REPOSITORIES: ${{ secrets.CHILD_RUNTIME_REPOSITORIES }}
          CONTINUUM_ENGINE_ROOT: ${{ github.workspace }}/.continuum-engine
          CONTINUUM_EXPECTED_OPENCODE_VERSION: ${{ steps.toolchain.outputs.runtime-version }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "::error::Parent TAP_PAT is unavailable"; exit 2; }
          pool="${CONTINUUM_APPROVED_MODELS:-}"
          test -n "$pool" || { echo "::error::Parent OPENCODE_MODELS repository variable is empty"; exit 2; }
          expected_targets="${CONTINUUM_EXPECTED_TARGETS:-2}"
          [[ "$expected_targets" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::CONTINUUM_PRIVATE_ROLLOUT_TARGETS must be a positive integer"; exit 2;
          }
          # Build the authorized child map from one repository inventory plus
          # one variables read per private repository, stopping once every
          # allowlisted Child is mapped. Private identities stay in the runner
          # temp file and are never printed, masked in env, or promoted to job
          # outputs. An incomplete map fails closed instead of using the secret
          # inventory fallback.
          if [[ -z "${CHILD_REPOSITORIES:-}" ]]; then
            map_rc=0
            python3 .parent-rollout/automation/private_model_api.py child-map \
              > "$RUNNER_TEMP/private-child-map.json" || map_rc=$?
            if (( map_rc == 0 )); then
              CHILD_REPOSITORIES="$(cat "$RUNNER_TEMP/private-child-map.json")"
              export CHILD_REPOSITORIES
            else
              echo "::error::Authorized Parent/Child mapping failed or incomplete (rc=$map_rc); refusing to fall back to secret"; exit 2;
            fi
          fi
          # Continuum's own resolver validates parent/child relations; never log its plan.
          bash "$CONTINUUM_ENGINE_ROOT/.github/scripts/delegation_repository.sh" plan \
            > "$RUNNER_TEMP/private-child-plan.json" || {
              echo "::error::Authorized Parent/Child discovery failed"; exit 2;
            }
          jq -e 'type=="array"' "$RUNNER_TEMP/private-child-plan.json" >/dev/null
          count=0
          : > "$RUNNER_TEMP/private-child-targets.jsonl"
          # One pass over the authorized inventory. No separate admission scan
          # repeats repository metadata or marker requests.
          while IFS= read -r child <&3; do
            test -n "$child" || continue
            echo "::add-mask::$child"
            is_private="$(python3 .parent-rollout/automation/private_model_api.py metadata "$child")" || {
              echo "::error::Child repository metadata unavailable"; exit 2;
            }
            test "$is_private" = true || continue
            marker_rc=0
            python3 .parent-rollout/automation/private_model_api.py marker "$child" || marker_rc=$?
            if (( marker_rc == 1 )); then
              continue
            fi
            if (( marker_rc != 0 )); then
              echo "::error::Child rollout marker check failed"; exit 2;
            fi
            # Read first; only write when the approved policy actually differs.
            python3 .parent-rollout/automation/private_model_api.py ensure-variable "$child" "$pool" || {
              echo "::error::Child model policy check or update failed"; exit 2;
            }
            export OPENCODE_MODELS="$pool"
            export OPENCODE_MODEL=""
            export CONTINUUM_EXPLICIT_MODEL=""
            export CONTINUUM_MODEL_TASK_CLASS=coder
            export CONTINUUM_MODEL_PROFILE=consumer-model-rollout
            export CONTINUUM_MODEL_STATE_REPOSITORY="$child"
            export CONTINUUM_MODEL_STATE_TOKEN="$GH_TOKEN"
            export CONTINUUM_MODEL_CREDENTIAL_SCOPE=anonymous
            selected="$(python3 "$CONTINUUM_ENGINE_ROOT/src/continuum/model_routing.py" select)" || {
              echo "::error::Child route qualification failed"; exit 2;
            }
            : "${selected:?Qualified model was empty}"
            work="$(mktemp -d)"
            (
              cd "$work"
              # Whitelisted anonymous environment: no Parent token, private
              # repository inventory, state identity or Actions credentials.
              env -i \
                PATH="$PATH" \
                HOME="$HOME" \
                LANG="${LANG:-C.UTF-8}" \
                LC_ALL="${LC_ALL:-C.UTF-8}" \
                TZ="${TZ:-UTC}" \
                TERM="${TERM:-dumb}" \
                CI=true \
                OPENCODE_MODELS="$OPENCODE_MODELS" \
                CONTINUUM_MODEL_CREDENTIAL_SCOPE="$CONTINUUM_MODEL_CREDENTIAL_SCOPE" \
                CONTINUUM_MODEL_PROFILE="$CONTINUUM_MODEL_PROFILE" \
                CONTINUUM_MODEL_TASK_CLASS="$CONTINUUM_MODEL_TASK_CLASS" \
                opencode run --auto --model "$selected" \
                'Create a file called acceptance-proof.txt with exactly ACCEPTANCE_OK and no other text.' \
                </dev/null >"$RUNNER_TEMP/continuum-private-agent.log" 2>&1
              test -f acceptance-proof.txt
              test "$(cat acceptance-proof.txt)" = ACCEPTANCE_OK
            ) || {
              rm -rf "$work"
              echo "::error::Private Child real LLM file-tool test failed"; exit 2;
            }
            rm -rf "$work"
            export CONTINUUM_SELECTED_MODEL="$selected"
            python3 "$CONTINUUM_ENGINE_ROOT/src/continuum/model_routing.py" record || {
              echo "::error::Child durable state attestation failed"; exit 2;
            }
            jq -cn --arg repository "$child" --arg model "$selected" \
              '{repository:$repository,model:$model}' >> "$RUNNER_TEMP/private-child-targets.jsonl"
            count=$((count + 1))
            echo "A private Child: policy persisted, real file-tool task completed and state recorded."
          done 3< <(jq -r '[.[].repository] | unique | .[]' "$RUNNER_TEMP/private-child-plan.json")
          test "$count" -eq "$expected_targets" || { echo "::error::Expected exactly $expected_targets enrolled private rollout target(s)"; exit 2; }
          sealed="$(python3 .parent-rollout/automation/private_model_receipt.py seal "$RUNNER_TEMP/private-child-targets.jsonl")"
          printf 'count=%s\nsealed=%s\n' "$count" "$sealed" >> "$GITHUB_OUTPUT"
          echo "Parent completed qualified private Child model rollout for $count registered target(s)."

  fresh-runner:
    needs: provision-and-prove
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout canonical Continuum state implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kodmial/continuum
          ref: main
          path: .continuum-engine
          persist-credentials: false
      - name: Checkout exact Parent receipt verification code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: .parent-rollout
          persist-credentials: false
      - name: Restore verified cached OpenCode binary for provenance
        id: toolchain
        uses: kodmial/continuum/.github/actions/agent-toolchain@main
        with:
          components: opencode
          opencode-version: ${{ vars.CONTINUUM_OPENCODE_VERSION || '' }}
      - name: Verify exact persisted private Child real-success receipts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          CONTINUUM_APPROVED_MODELS: ${{ vars.OPENCODE_MODELS }}
          CONTINUUM_EXPECTED_TARGETS: ${{ vars.CONTINUUM_PRIVATE_ROLLOUT_TARGETS || '2' }}
          CONTINUUM_SEALED_RECEIPT: ${{ needs.provision-and-prove.outputs.sealed }}
          CONTINUUM_ENGINE_ROOT: ${{ github.workspace }}/.continuum-engine
          CONTINUUM_EXPECTED_OPENCODE_VERSION: ${{ steps.toolchain.outputs.runtime-version }}
        run: |
          set -euo pipefail
          # No discovery, no variables API, no state mutation and no new LLM call.
          # Recovery: rerun only this failed job; the sealed handoff is bound to
          # the trusted run (not the attempt), so no paid/free model request or
          # state write is repeated when provision-and-prove already succeeded.
          python3 .parent-rollout/automation/private_model_receipt.py verify
