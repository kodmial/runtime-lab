name: Emergency cancel stale Render run

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale run if still active
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: "37199348358"
        run: |
          set -euo pipefail
          status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID" --jq '.status')"
          case "$status" in
            queued|in_progress|pending|requested|waiting)
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID/cancel" >/dev/null
              echo "Cancellation requested for stale run $TARGET_RUN_ID."
              ;;
            *)
              echo "Run $TARGET_RUN_ID is already terminal ($status); nothing to cancel."
              ;;
          esac
