name: Bootstrap runtime secret public key

on:
  push:
    paths:
      - '.github/workflows/continuum-bootstrap-runtime-secret.yml'
  # A manual run is the only way to point the bootstrap at a repository other
  # than the one this stub is installed in. The input is optional and empty by
  # default, so a consumer that only ever bootstraps itself never has to set
  # it — an empty value falls through to the caller's own repository.
  workflow_dispatch:
    inputs:
      repository:
        description: "Repository to bootstrap the secret into; empty means this repository"
        required: false
        type: string

permissions:
  contents: read

jobs:
  call:
    uses: kodmial/continuum/.github/workflows/continuum-bootstrap-runtime-secret.yml@main
    secrets: inherit
    with:
      continuum_ref: main
      # Bare passthrough, and deliberately empty on the `push` path: this
      # stub is installed into every consumer, so the target must resolve
      # to whichever repository the caller lives in rather than to a name
      # pinned here. Empty is what lets the callee fall through to
      # vars.CONTINUUM_TARGET_REPOSITORY and then to `github.repository`.
      repository: "${{ inputs.repository }}"
