name: PR Agent (manual, Groq)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-agent-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  pr-agent:
    if: >-
      github.event.issue.pull_request &&
      github.actor == github.repository_owner &&
      (
        startsWith(github.event.comment.body, '/review') ||
        startsWith(github.event.comment.body, '/improve') ||
        startsWith(github.event.comment.body, '/describe') ||
        startsWith(github.event.comment.body, '/ask')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check Groq secret
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [[ -z "$GROQ_API_KEY" ]]; then
            echo "::error::Missing repository Actions secret GROQ_API_KEY"
            echo "Add it under Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi

      - name: Run PR-Agent
        uses: docker://pragent/pr-agent:github_action@sha256:65e5b196e38cecd7df8a71fe29942052e081a0c6645132c2ac874df60b1760c7 # 0.46.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ.KEY: ${{ secrets.GROQ_API_KEY }}
