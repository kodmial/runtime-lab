name: Cancel stale OpenCode run

on:
  push:
    paths:
      - '.github/workflows/cancel-stale-opencode-temp.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Force-cancel stale run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST repos/kodmial/runtime-lab/actions/runs/36373494649/force-cancel
