name: OpenCode repair controller

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number"
        required: true
        type: string
      head_sha:
        description: "PR head SHA evaluated by CI"
        required: true
        type: string
      conclusion:
        description: "CI conclusion: success or failure"
        required: true
        type: string
      run_id:
        description: "CI workflow run id"
        required: true
        type: string
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: opencode-repair-${{ inputs.pr_number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Reconcile CI or PR update
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const workflowDispatch = context.eventName === 'workflow_dispatch';
            const prNumber = Number(
              workflowDispatch
                ? '${{ inputs.pr_number }}'
                : context.payload.pull_request.number
            );
            const {data: pr} = await github.rest.pulls.get({
              owner, repo, pull_number: prNumber,
            });

            if (
              pr.state !== 'open' ||
              pr.head.repo?.full_name !== `${owner}/${repo}` ||
              !/^opencode\/issue\d+-/.test(pr.head.ref)
            ) {
              core.info(`PR #${prNumber} is not an open same-repository OpenCode PR.`);
              return;
            }

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.createLabel({owner, repo, name, color, description});
              } catch (err) {
                if (err.status !== 422) throw err;
              }
            }

            async function hasLabel(name) {
              const labels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
                owner, repo, issue_number: prNumber, per_page: 100,
              });
              return labels.some(label => label.name === name);
            }

            async function removeLabel(name) {
              try {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: prNumber, name,
                });
              } catch (err) {
                if (err.status !== 404) throw err;
              }
            }

            const ciLock = 'opencode-ci-repair';
            await ensureLabel(
              ciLock,
              'FBCA04',
              'One automatic OpenCode CI repair attempt per failing PR head.'
            );

            if (!workflowDispatch) {
              if (context.payload.action === 'synchronize' || context.payload.action === 'reopened') {
                await removeLabel(ciLock);
              }
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id: 'auto-merge.yml', ref: 'main',
              });
              return;
            }

            const expectedHead = '${{ inputs.head_sha }}';
            const conclusion = '${{ inputs.conclusion }}';
            const runId = '${{ inputs.run_id }}';

            if (pr.head.sha !== expectedHead) {
              core.info(
                `Ignoring stale CI result for ${expectedHead}; PR #${prNumber} is now ${pr.head.sha}.`
              );
              return;
            }

            if (conclusion === 'success') {
              await removeLabel(ciLock);
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id: 'auto-merge.yml', ref: 'main',
              });
              core.notice(`PR #${prNumber}: CI passed; dispatched auto-merge reconciliation.`);
              return;
            }

            if (await hasLabel(ciLock)) {
              core.info(
                `PR #${prNumber}: automatic CI repair already attempted for this head.`
              );
              return;
            }

            await github.rest.issues.addLabels({
              owner, repo, issue_number: prNumber, labels: [ciLock],
            });

            try {
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: 'opencode.yml',
                ref: 'main',
                inputs: {
                  mode: 'ci-fix',
                  pr_number: String(prNumber),
                  head_ref: pr.head.ref,
                  run_id: runId,
                },
              });
              core.notice(`PR #${prNumber}: dispatched one OpenCode CI repair.`);
            } catch (err) {
              await removeLabel(ciLock);
              throw err;
            }
