name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to validate
        required: false
        type: string

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read
  statuses: write

concurrency:
  group: runtime-lab-ci-${{ inputs.pr_number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  call:
    uses: kodmial/continuum/.github/workflows/continuum-validation.yml@main
    secrets: inherit
    with:
      continuum_ref: main
      runner: ubuntu-latest
      auto_detect: 'true'
      status_context: runtime-lab/ci
      publish_status: 'true'
      dispatch_repair: 'true'
      repair_workflow: continuum-opencode-repair.yml
      pr_number: "${{ inputs.pr_number }}"
      skip_opencode_pull_request: 'true'
