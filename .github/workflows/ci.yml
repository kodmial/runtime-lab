name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to validate"
        required: false
        type: string

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read
  statuses: write

concurrency:
  group: runtime-lab-ci-${{ inputs.pr_number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # OpenCode PRs are validated by the explicit workflow_dispatch issued
    # after branch/PR creation. Skipping the duplicate pull_request job
    # avoids two CI runs racing in the same concurrency group and producing
    # misleading red/no-job runs. Human/non-OpenCode PRs still run normally.
    if: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'opencode/') == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Resolve target
        id: target
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            let sha = context.sha;
            let ref = context.ref;
            let prNumber = '';

            if (context.eventName === 'pull_request') {
              sha = context.payload.pull_request.head.sha;
              ref = context.payload.pull_request.head.ref;
              prNumber = String(context.payload.pull_request.number);
            } else if (context.eventName === 'workflow_dispatch' && '${{ inputs.pr_number }}') {
              prNumber = '${{ inputs.pr_number }}';
              const {data: pr} = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: Number(prNumber),
              });
              sha = pr.head.sha;
              ref = pr.head.ref;
            }

            core.setOutput('sha', sha);
            core.setOutput('ref', ref);
            core.setOutput('pr_number', prNumber);

      - name: Mark CI pending
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.TARGET_SHA,
              state: 'pending',
              context: 'runtime-lab/ci',
              description: 'CI is running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Checkout target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false

      - name: Detect project stack
        id: stack
        shell: bash
        run: |
          set -euo pipefail

          python=false
          node=false
          java=false
          go=false
          rust=false

          if [[ -f pyproject.toml || -f requirements.txt || -f setup.py || -f setup.cfg ]] || \
             find . -type f -name '*.py' -not -path './.git/*' -not -path './.github/*' | grep -q .; then
            python=true
          fi
          [[ -f package.json ]] && node=true
          if [[ -f pom.xml || -f mvnw || -f build.gradle || -f build.gradle.kts || -f gradlew ]]; then
            java=true
          fi
          [[ -f go.mod ]] && go=true
          [[ -f Cargo.toml ]] && rust=true

          {
            echo "python=$python"
            echo "node=$node"
            echo "java=$java"
            echo "go=$go"
            echo "rust=$rust"
          } >> "$GITHUB_OUTPUT"

          echo "Detected: python=$python node=$node java=$java go=$go rust=$rust"

      - name: Set up Python
        if: steps.stack.outputs.python == 'true'
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5
        with:
          python-version: "3.12"

      - name: Run project checks
        id: checks
        shell: bash
        run: |
          set -euo pipefail

          checked=false

          if [[ "${{ steps.stack.outputs.python }}" == "true" ]]; then
            checked=true
            echo "::group::Python"
            python -m compileall -q -x '(^|/)(\.git|\.venv|venv)(/|$)' .
            python -m pip install --upgrade pip
            if [[ -f requirements.txt ]]; then
              python -m pip install -r requirements.txt
            fi
            if [[ -f pyproject.toml ]]; then
              python -m pip install -e .
            fi
            if find . -type f \( -name 'test_*.py' -o -name '*_test.py' \) -not -path './.git/*' | grep -q .; then
              python -m pip install pytest
              python -m pytest -q
            else
              echo "No Python tests detected."
            fi
            echo "::endgroup::"
          fi

          if [[ "${{ steps.stack.outputs.node }}" == "true" ]]; then
            checked=true
            echo "::group::Node"
            node --version
            npm --version
            if [[ -f package-lock.json ]]; then
              npm ci
            else
              npm install
            fi
            npm test --if-present
            npm run build --if-present
            echo "::endgroup::"
          fi

          if [[ "${{ steps.stack.outputs.java }}" == "true" ]]; then
            checked=true
            echo "::group::Java"
            java -version
            if [[ -f mvnw ]]; then
              chmod +x mvnw
              ./mvnw -B verify
            elif [[ -f pom.xml ]]; then
              mvn -B verify
            fi
            if [[ -f gradlew ]]; then
              chmod +x gradlew
              ./gradlew build
            elif [[ -f build.gradle || -f build.gradle.kts ]]; then
              gradle build
            fi
            echo "::endgroup::"
          fi

          if [[ "${{ steps.stack.outputs.go }}" == "true" ]]; then
            checked=true
            echo "::group::Go"
            go version
            go test ./...
            go build ./...
            echo "::endgroup::"
          fi

          if [[ "${{ steps.stack.outputs.rust }}" == "true" ]]; then
            checked=true
            echo "::group::Rust"
            rustc --version
            cargo --version
            cargo test --all-targets
            cargo build --all-targets
            echo "::endgroup::"
          fi

          if [[ -f Dockerfile ]]; then
            checked=true
            echo "::group::Docker"
            docker build -t runtime-lab-ci .
            echo "::endgroup::"
          fi

          while IFS= read -r -d '' script; do
            checked=true
            bash -n "$script"
          done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)

          if [[ "$checked" == "false" ]]; then
            echo "No implementation stack exists yet; nothing language-specific to build."
          fi

      - name: Publish CI result and continue automation
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          CHECK_OUTCOME: ${{ steps.checks.outcome }}
        with:
          script: |
            const passed = process.env.CHECK_OUTCOME === 'success';
            const state = passed ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.TARGET_SHA,
              state,
              context: 'runtime-lab/ci',
              description: passed ? 'CI passed' : 'CI failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

            if (process.env.PR_NUMBER) {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'opencode-repair.yml',
                ref: 'main',
                inputs: {
                  pr_number: process.env.PR_NUMBER,
                  head_sha: process.env.TARGET_SHA,
                  conclusion: state,
                  run_id: String(context.runId),
                },
              });
            }
