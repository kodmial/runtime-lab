name: Render execution controller

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number being executed"
        required: true
        type: string
      mode:
        description: "Execution mode: smoke or e2e"
        required: true
        type: string

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  # Development invariant from issues #1/#4: only one automation-owned
  # ephemeral Render worker may exist at a time.
  group: runtime-lab-render-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      EXECUTION_MODE: ${{ inputs.mode }}
      RENDER_STATE_FILE: /tmp/runtime-lab-render-state.json
      RENDER_RESULT_FILE: /tmp/runtime-lab-render-result.json
      RENDER_REGION: ${{ vars.RENDER_REGION || 'oregon' }}
      OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}
      MAX_RENDER_REPAIR_ATTEMPTS: ${{ vars.AUTOMATION_MAX_RENDER_REPAIR_ATTEMPTS || '3' }}

    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Execute Render lifecycle
        id: execute
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          RENDER_API_KEY: ${{ secrets.KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXECUTION_MODE" == "smoke" || "$EXECUTION_MODE" == "e2e" ]] || {
            echo "::error::Unsupported execution mode: $EXECUTION_MODE"
            exit 2
          }
          [[ -f automation/render-job.sh ]] || {
            echo "::error::Missing automation/render-job.sh"
            exit 2
          }
          bash automation/render-job.sh

      - name: Delete ephemeral Render service
        id: cleanup
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          RENDER_API_KEY: ${{ secrets.KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f automation/render-cleanup.sh ]]; then
            bash automation/render-cleanup.sh
            exit 0
          fi

          if [[ -s "$RENDER_STATE_FILE" ]]; then
            echo "::error::Render state exists but automation/render-cleanup.sh is missing"
            exit 1
          fi

          echo "No Render state was created; cleanup has nothing to delete."

      - name: Finalize execution
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        shell: bash
        run: |
          set -euo pipefail

          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --remove-label "automation:in-progress" >/dev/null 2>&1 || true

          if [[ "$EXECUTE_OUTCOME" != "success" || "$CLEANUP_OUTCOME" != "success" ]]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --add-label "automation:paused" >/dev/null 2>&1 || true

            COMMENTS_JSON="$(gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" 2>/dev/null || echo "[]")"
            REPAIR_COUNT="$(jq '[.[][]? | select((.body // "") | contains("<!-- runtime-lab-render-repair-attempt -->"))] | length' \
              <<<"$COMMENTS_JSON" 2>/dev/null || echo 0)"

            if [[ "$REPAIR_COUNT" -lt "$MAX_RENDER_REPAIR_ATTEMPTS" ]]; then
              SOURCE_MARKER="<!-- runtime-lab-render-repair source=$ISSUE_NUMBER -->"
              ALL_ISSUES_JSON="$(gh api --paginate --slurp \
                "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" 2>/dev/null || echo "[]")"
              EXISTING_REPAIR="$(jq -r --arg marker "$SOURCE_MARKER" \
                '.[][]? | select((.body // "") | contains($marker)) | .number' \
                <<<"$ALL_ISSUES_JSON" | head -n 1)"

              if [[ -z "$EXISTING_REPAIR" ]]; then
                REPAIR_BODY="$(cat <<EOF
          <!-- runtime-lab-render-repair source=$ISSUE_NUMBER -->
          <!-- runtime-lab-render-failed-run=$GITHUB_RUN_ID -->
          
          ## Goal
          
          Repair the concrete repository defect that caused Render execution for source issue #$ISSUE_NUMBER to fail in workflow run $GITHUB_RUN_ID.
          
          ## Required investigation
          
          - Inspect the failed run using: gh run view $GITHUB_RUN_ID --repo $GITHUB_REPOSITORY --log-failed.
          - Identify the root cause from evidence; do not guess or mask the failure.
          - For external API behavior, verify the contract against current official vendor documentation.
          - Fix the reusable implementation, not only this single run.
          - Add or strengthen regression tests for the discovered failure mode.
          - Run the relevant test suite and keep the change scoped.
          - Do not close or modify source issue #$ISSUE_NUMBER. It stays paused until this repair PR is merged.
          
          ## Failure context
          
          - Source issue: #$ISSUE_NUMBER
          - Failed run: $GITHUB_RUN_ID
          - Execute outcome: $EXECUTE_OUTCOME
          - Cleanup outcome: $CLEANUP_OUTCOME
          - Execution mode: $EXECUTION_MODE
          EOF
                )"
                REPAIR_URL="$(gh issue create --repo "$GITHUB_REPOSITORY" \
                  --title "P0: Repair Render execution failure for #$ISSUE_NUMBER (run $GITHUB_RUN_ID)" \
                  --label "priority:p0" --body "$REPAIR_BODY")"
                gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$(cat <<EOF
          <!-- runtime-lab-render-repair-attempt -->
          Render execution failed (execute=$EXECUTE_OUTCOME, cleanup=$CLEANUP_OUTCOME, run=$GITHUB_RUN_ID).
          Created automatic recovery issue: $REPAIR_URL
          The source issue remains paused until the recovery PR merges.
          EOF
                )"
                gh workflow run issue-scheduler.yml --repo "$GITHUB_REPOSITORY" --ref main
              else
                gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
                  --body "Render execution failed in run $GITHUB_RUN_ID; recovery issue #$EXISTING_REPAIR is already open, so no duplicate repair was created."
              fi
            else
              gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
                --body "Render execution failed in run $GITHUB_RUN_ID. Automatic recovery limit ($MAX_RENDER_REPAIR_ATTEMPTS) is exhausted; issue remains paused for inspection."
            fi

            echo "::error::Render execution or mandatory cleanup failed"
            exit 1
          fi

          if [[ "$EXECUTION_MODE" == "smoke" ]]; then
            gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --reason completed \
              --comment "Real Render smoke execution and mandatory cleanup completed successfully in workflow run $GITHUB_RUN_ID."
            gh workflow run issue-scheduler.yml --repo "$GITHUB_REPOSITORY" --ref main
          else
            PR_JSON="$(gh pr list --repo "$GITHUB_REPOSITORY" --state all --limit 100 \
              --json number,headRefName,state)"
            PR_NUMBER="$(jq -r --arg prefix "opencode/issue$ISSUE_NUMBER-" \
              '[.[] | select(.headRefName | startswith($prefix))][0].number // empty' \
              <<<"$PR_JSON")"

            if [[ -z "$PR_NUMBER" ]]; then
              gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
                --add-label "automation:paused" >/dev/null 2>&1 || true
              gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
                --body "Render E2E execution and cleanup succeeded in workflow run $GITHUB_RUN_ID, but no compatible opencode/issue${ISSUE_NUMBER}-... PR was found."
              echo "::error::E2E mode completed without the required PR"
              exit 1
            fi

            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --add-label "automation:in-progress" >/dev/null 2>&1 || true
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body "Render E2E execution and cleanup succeeded in workflow run $GITHUB_RUN_ID; PR #$PR_NUMBER is now in the CI/merge chain."
          fi
