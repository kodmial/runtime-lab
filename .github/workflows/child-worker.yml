name: Child task
run-name: "Child task [${{ inputs.child_id }}] #${{ inputs.task_number }}"

on:
  workflow_dispatch:
    inputs:
      child_id:
        description: Configured child id
        required: true
        type: string
      task_number:
        description: Child task number
        required: true
        type: string

permissions:
  contents: read

jobs:
  worker:
    uses: kodmial/continuum/.github/workflows/consumer-child-worker.yml@bf10517653826f337f933fe49c1e26569b2a0e3c
    with:
      child_id: ${{ inputs.child_id }}
      task_number: ${{ inputs.task_number }}
      model: ${{ vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}
      max_agent_passes: 4
      engine_ref: bf10517653826f337f933fe49c1e26569b2a0e3c
    secrets:
      CHILD_RUNTIME_TOKEN: ${{ secrets.TAP_PAT }}
