name: Migrate delegation variables

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/migrate-delegation-variables.yml

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.TAP_PAT }}
      GITHUB_TOKEN: ${{ secrets.TAP_PAT }}
      CONTINUUM_REF: 152a269cec32600049bae2af67bfc95e56eec50b
    steps:
      - name: Checkout parent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout Continuum
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kodmial/continuum
          ref: ${{ env.CONTINUUM_REF }}
          path: .continuum-engine
          fetch-depth: 1
          persist-credentials: false

      - name: Migrate parent and child relationship values
        shell: bash
        run: |
          set -euo pipefail
          export CONTINUUM_ENGINE_ROOT="$GITHUB_WORKSPACE/.continuum-engine"
          export PYTHONPATH="$CONTINUUM_ENGINE_ROOT/src"
          relation="$CONTINUUM_ENGINE_ROOT/.github/scripts/delegation_runtime.py"
          resolver="$CONTINUUM_ENGINE_ROOT/.github/scripts/delegation_repository.sh"

          upsert_variable() {
            local repository="$1" name="$2" value="$3"
            if gh api "repos/$repository/actions/variables/$name" >/dev/null 2>&1; then
              gh api --method PATCH "repos/$repository/actions/variables/$name"                 -f "name=$name" -f "value=$value" >/dev/null
            else
              gh api --method POST "repos/$repository/actions/variables"                 -f "name=$name" -f "value=$value" >/dev/null
            fi
          }

          mapfile -t child_ids < <(
            python3 "$relation" parent-child-ids --config .continuum.yml
          )
          [[ "${#child_ids[@]}" -gt 0 ]] || {
            echo "::error::Legacy parent configuration has no child ids to migrate."
            exit 2
          }

          children_json="$(
            printf '%s\n' "${child_ids[@]}" | jq -R . | jq -sc .
          )"

          upsert_variable "$GITHUB_REPOSITORY" CONTINUUM_ROLE parent
          upsert_variable "$GITHUB_REPOSITORY" CONTINUUM_CHILDREN "$children_json"

          for child_id in "${child_ids[@]}"; do
            child_repo="$(
              PARENT_CONFIG=.continuum.yml                 bash "$resolver" resolve "$child_id"
            )"

            child_config="$RUNNER_TEMP/continuum-child-${child_id}.yml"
            gh api "repos/$child_repo/contents/.continuum.yml" --jq '.content' 2>/dev/null               | tr -d '\n' | base64 -d >"$child_config"

            python3 "$relation" verify-child               --config "$child_config"               --child-id "$child_id"               --parent-repository "$GITHUB_REPOSITORY" >/dev/null

            validation_script="$(
              python3 "$relation" validation-script --config "$child_config"
            )"

            upsert_variable "$child_repo" CONTINUUM_ROLE child
            upsert_variable "$child_repo" CONTINUUM_CHILD_ID "$child_id"
            upsert_variable "$child_repo" CONTINUUM_PARENT "$GITHUB_REPOSITORY"
            if [[ -n "$validation_script" ]]; then
              upsert_variable "$child_repo" CONTINUUM_VALIDATION_SCRIPT "$validation_script"
            fi

            for name in CONTINUUM_ROLE CONTINUUM_CHILD_ID CONTINUUM_PARENT; do
              gh api "repos/$child_repo/actions/variables/$name" --jq '.name' >/dev/null
            done
            if [[ -n "$validation_script" ]]; then
              gh api "repos/$child_repo/actions/variables/CONTINUUM_VALIDATION_SCRIPT" --jq '.name' >/dev/null
            fi
          done

          for name in CONTINUUM_ROLE CONTINUUM_CHILDREN; do
            gh api "repos/$GITHUB_REPOSITORY/actions/variables/$name" --jq '.name' >/dev/null
          done

          echo "Delegation repository variables migrated and verified."
