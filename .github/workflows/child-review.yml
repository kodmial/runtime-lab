name: Child review
run-name: "Child review [${{ inputs.child_id }}] #${{ inputs.task_number }}"

on:
  workflow_dispatch:
    inputs:
      child_id:
        description: Configured child id
        required: true
        type: string
      task_number:
        description: Child task number
        required: true
        type: string
      pr_number:
        description: Child pull request number
        required: true
        type: string

permissions:
  contents: read

jobs:
  review:
    uses: kodmial/continuum/.github/workflows/consumer-child-review.yml@b9c348e5a50f8e59f8d30a7cc75fd25782665750
    with:
      child_id: ${{ inputs.child_id }}
      task_number: ${{ inputs.task_number }}
      pr_number: ${{ inputs.pr_number }}
      model: ${{ vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}
      max_review_passes: 3
      engine_ref: b9c348e5a50f8e59f8d30a7cc75fd25782665750
    secrets:
      CHILD_RUNTIME_TOKEN: ${{ secrets.TAP_PAT }}
      CHILD_RUNTIME_REPOSITORIES: ${{ secrets.CONTINUUM_CHILD_REPOSITORIES }}
