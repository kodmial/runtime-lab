name: Retry CodeRabbit after rate limit

on:
  # Any new/edited CodeRabbit rate-limit response wakes the global controller.
  issue_comment:
    types: [created, edited]

  # A completed CodeRabbit review consumes the shared included-review quota.
  # Wake the controller so it can move the next queued PR behind the global
  # cooldown instead of immediately burning another retry.
  pull_request_review:
    types: [submitted]

  # A CodeRabbit finding verdict is a lifecycle transition too. Wake the
  # serialized queue immediately after RESOLVED/UNRESOLVED instead of waiting
  # for cron or an unrelated status/review event.
  pull_request_review_comment:
    types: [created, edited]

  # Bounded repository-local safety net for deferred quota waits. The
  # controller is non-blocking and exits immediately when nothing is due, so
  # a scheduled safety-net tick costs no review slot. Once a durable dueAt
  # passes without any review/comment/status event, the next tick reconciles
  # the queue. Offset :03 avoids the busy :00 boundary and the
  # auto-merge/scheduler slots.
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'

  # Redundant liveness wakes. GitHub may delay or drop an individual scheduled
  # event under load. Wake only after controllers that run on a stable PR HEAD:
  # direct main-push / issue-scheduler wakes can race auto-merge's update-branch
  # synchronization and make CodeRabbit abort with "Head commit changed".
  workflow_run:
    workflows:
      - PR-Agent recovery
      - Auto-merge reviewed pull requests
    types: [completed]

  # Manual/safety-net reconciliation.
  workflow_dispatch:

permissions:
  # Keep the caller compatible with already-open PR branches. The review
  # queue only reads Actions state; exact-finding verification remains owned by
  # the existing auto-merge reconciler.
  actions: read
  contents: read
  issues: write
  pull-requests: read
  statuses: read

jobs:
  call:
    uses: kodmial/continuum/.github/workflows/continuum-coderabbit-retry.yml@main
    secrets: inherit
    with:
      continuum_ref: main
