name: Retry CodeRabbit after rate limit

on:
  # Any new/edited CodeRabbit rate-limit response wakes the global controller.
  issue_comment:
    types: [created, edited]

  # A completed CodeRabbit review counts as the review for that push.
  # Wake the controller so it can move the next queued PR behind the global
  # cooldown instead of immediately issuing another retry.
  pull_request_review:
    types: [submitted]

  # A CodeRabbit finding verdict is a lifecycle transition too. Wake the
  # serialized queue immediately after RESOLVED/UNRESOLVED instead of waiting
  # for cron or an unrelated status/review event.
  pull_request_review_comment:
    types: [created, edited]

  # Provider-owned safety net: CodeRabbit recovery must not depend on any
  # PR-Agent workflow or generic merge-controller completion.
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"

  # Manual/safety-net reconciliation. The PR identity is a wake hint because
  # the controller itself stays global.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request that woke the controller"
        required: false
        default: ''
        type: string

permissions:
  # Keep the caller compatible with already-open PR branches. The review
  # queue only reads Actions state; exact-finding verification remains owned by
  # the existing auto-merge reconciler.
  actions: read
  contents: read
  issues: write
  pull-requests: read
  statuses: read

jobs:
  call:
    # Private Child repositories do not run local PR lifecycle controllers.
    # Non-CodeRabbit consumers do not run this controller either.
    # Only the provider's real quota response is actionable on issue_comment.
    # Filter before the reusable engine's shared concurrency admission:
    # OpenCode live-event edits must not evict pending CodeRabbit wakes.
    if: >-
      vars.CONTINUUM_ROLE != 'child' &&
      (vars.CONTINUUM_REVIEW_PROVIDER || 'none') == 'coderabbit' &&
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request != null &&
        github.event.comment.user.login == 'coderabbitai[bot]' &&
        (contains(github.event.comment.body, 'Review rate limited') ||
         contains(github.event.comment.body, 'Review limit reached')))) &&
      (github.event_name != 'pull_request_review' ||
       (github.event.review.user.login == 'coderabbitai[bot]' &&
        github.event.pull_request.state == 'open')) &&
      (github.event_name != 'pull_request_review_comment' ||
       (startsWith(github.event.comment.user.login, 'coderabbitai') &&
        github.event.pull_request.state == 'open'))
    uses: kodmial/continuum/.github/workflows/continuum-coderabbit-retry.yml@main
    secrets: inherit
    with:
      continuum_ref: main
      pr_number: "${{ inputs.pr_number }}"
