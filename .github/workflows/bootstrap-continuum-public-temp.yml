name: Bootstrap Continuum visibility

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  publish:
    if: github.event.issue.title == '[bootstrap] publish continuum'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.TAP_PAT }}
    steps:
      - name: Make Continuum public
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "::error::TAP_PAT is missing"; exit 1; }
          gh api --method PATCH repos/kodmial/continuum -F private=false >/dev/null
          visibility="$(gh api repos/kodmial/continuum --jq .visibility)"
          test "$visibility" = "public" || { echo "::error::visibility is $visibility"; exit 1; }
          echo "kodmial/continuum is public."
