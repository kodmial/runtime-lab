name: Worker dispatcher

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - automation/private_dispatcher.sh
      - .github/workflows/private-dispatcher.yml
  schedule:
    - cron: '*/10 * * * *'
  workflow_run:
    workflows:
      - Worker task
      - Worker review
    types:
      - completed

permissions:
  contents: read
  actions: write

concurrency:
  group: worker-dispatcher
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.TAP_PAT }}
      GITHUB_TOKEN: ${{ secrets.TAP_PAT }}
    steps:
      - name: Checkout control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Dispatch next private task
        shell: bash
        run: bash automation/private_dispatcher.sh
