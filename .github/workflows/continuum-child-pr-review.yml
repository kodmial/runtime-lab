name: SubTask PR review
run-name: "SubTask PR review #${{ inputs.pr_number }}"

on:
  workflow_dispatch:
    inputs:
      child_id:
        description: Configured child id
        required: true
        type: string
      pr_number:
        description: Child pull request number
        required: true
        type: string

permissions:
  contents: read

jobs:
  review:
    uses: kodmial/continuum/.github/workflows/continuum-consumer-child-pr-review.yml@main
    with:
      child_id: ${{ inputs.child_id }}
      pr_number: ${{ inputs.pr_number }}
      model: ${{ vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}
      max_review_passes: 3
      engine_ref: main
    secrets:
      CHILD_RUNTIME_TOKEN: ${{ secrets.TAP_PAT }}
