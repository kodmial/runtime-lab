name: Bridge worker

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

jobs:
  bridge:
    if: ${{ github.actor == github.repository_owner && contains(github.event.comment.body, '/kodmai-54-worker') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.TAP_PAT }}
      GITHUB_TOKEN: ${{ secrets.TAP_PAT }}
      OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}
      OPENCODE_CONFIG_CONTENT: '{"permission":{"bash":{"*":"allow","git *":"allow","git push *":"deny"}}}'
    steps:
      - name: Checkout runtime-lab control scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run private Kodmai worker
        shell: bash
        run: bash automation/kodmai_issue54_worker.sh
