name: Kodmai issue 54 bridge worker

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

jobs:
  run:
    if: >-
      github.actor == github.repository_owner &&
      contains(github.event.comment.body, '/kodmai-54-worker')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.TAP_PAT }}
      GITHUB_TOKEN: ${{ secrets.TAP_PAT }}
      TARGET_REPO: kodmial/kodmai
      TARGET_ISSUE: "54"
      HISTORICAL_ZEN_REF: dbc43c18945b0f37125a57f7cc6c6206808cc412
      OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}
      OPENCODE_CONFIG_CONTENT: >-
        {"permission":{"bash":{"*":"allow","git *":"allow","git push *":"deny"}}}

    steps:
      - name: Verify private-repository access
        run: |
          set -euo pipefail
          gh api "repos/$TARGET_REPO" --jq '.full_name + " private=" + (.private|tostring)'
          gh api "repos/$TARGET_REPO/issues/$TARGET_ISSUE" --jq '.title'

      - name: Clone private Kodmai
        run: |
          set -euo pipefail
          gh auth setup-git
          gh repo clone "$TARGET_REPO" "$RUNNER_TEMP/kodmai" -- --quiet
          cd "$RUNNER_TEMP/kodmai"
          git fetch --all --tags --prune --quiet
          test "$(git rev-parse "$HISTORICAL_ZEN_REF^{commit}")" = "$HISTORICAL_ZEN_REF"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "runtime-lab/issue54-$GITHUB_RUN_ID"

      - name: Install OpenCode CLI
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl -fsSL https://opencode.ai/install | bash; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          test -x "$HOME/.opencode/bin/opencode"

      - name: Run Kodmai issue 54
        run: |
          set -euo pipefail
          ISSUE_BODY="$(gh api "repos/$TARGET_REPO/issues/$TARGET_ISSUE" --jq '.body')"
          cd "$RUNNER_TEMP/kodmai"

          PROMPT_FILE="$RUNNER_TEMP/kodmai54-prompt.txt"
          {
            cat <<'EOF'
You are executing private repository kodmial/kodmai issue #54 from an external GitHub-hosted runner.

Critical execution rules:
- Work only in the cloned private repository in the current directory.
- The current branch is a temporary implementation branch based on current main.
- Read and satisfy the complete issue body appended below.
- You MUST create a separate read-only historical worktree at exactly dbc43c18945b0f37125a57f7cc6c6206808cc412.
- Run the complete historical Kodmai application from that historical worktree. Do not replace this with reconstructed request-shape probes.
- Historical application/provider/router source is an oracle and must not be modified.
- Use exactly muse-spark-1.3-contributor-free for the Zen live proof.
- Prove plain curl -> historical Kodmai -> real Zen upstream -> real LLM -> Kodmai.
- Investigate setup/runtime/dependency problems until the live proof succeeds, within the available run time.
- Never print or write secrets/tokens.
- Do not modify .github/workflows/**.
- Commit only reproducibility code/docs or current-main test/support changes that are genuinely required by issue #54.
- Prefer scripts/reproduce_historical_zen.sh and docs/historical-zen-live-smoke.md as the durable deliverables.
- Sanitize all evidence written to repository files.
EOF
            printf '\n\n--- ISSUE #54 BODY ---\n%s\n' "$ISSUE_BODY"
          } > "$PROMPT_FILE"

          # Keep the agent transcript out of the public runtime-lab Actions log.
          # Only committed, sanitized deliverables are returned to private kodmai.
          opencode run --auto --model "$OPENCODE_MODEL" "$(cat "$PROMPT_FILE")"             >"$RUNNER_TEMP/opencode-kodmai54.log" 2>&1

      - name: Validate and publish private result
        if: success()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/kodmai"

          if git diff --name-only | grep -q '^\.github/workflows/'; then
            echo "::error::Worker modified workflow files; refusing to publish."
            exit 1
          fi

          if [[ -z "$(git status --porcelain)" ]]; then
            gh issue comment "$TARGET_ISSUE" --repo "$TARGET_REPO"               --body "Runtime-lab bridge worker completed without repository changes. No result was published. Source run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            exit 1
          fi

          git add -A
          git commit -m "test: reproduce historical Zen live path"
          BRANCH="$(git branch --show-current)"
          git push -u origin "HEAD:$BRANCH"

          PR_URL="$(gh pr create             --repo "$TARGET_REPO"             --base main             --head "$BRANCH"             --title "Prove historical Zen live path from clean runner"             --body "External runtime-lab worker for #54. The private Kodmai checkout and OpenCode transcript were not uploaded as runtime-lab artifacts. Sanitized reproducibility evidence is contained in this private PR.\n\nCloses #54")"

          gh issue comment "$TARGET_ISSUE" --repo "$TARGET_REPO"             --body "Runtime-lab bridge worker produced a private PR: $PR_URL"

      - name: Report bridge failure privately
        if: failure()
        run: |
          set +e
          gh issue comment "$TARGET_ISSUE" --repo "$TARGET_REPO"             --body "Runtime-lab bridge worker failed before producing a usable private PR. Source run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. The OpenCode transcript was intentionally not uploaded because runtime-lab may be publicly visible."
