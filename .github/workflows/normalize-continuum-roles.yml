name: Normalize Continuum delegation roles

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Continuum engine
        uses: actions/checkout@v4
        with:
          repository: kodmial/continuum
          ref: main
          token: ${{ secrets.TAP_PAT }}
          path: .continuum-engine

      - name: Normalize verified parent/child roles
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
        run: |
          set -euo pipefail
          set_var() {
            local repo="$1" name="$2" value="$3"
            if gh api "repos/$repo/actions/variables/$name" >/dev/null 2>&1; then
              gh api --method PATCH "repos/$repo/actions/variables/$name" -f value="$value" >/dev/null
            else
              gh api --method POST "repos/$repo/actions/variables" -f name="$name" -f value="$value" >/dev/null
            fi
          }

          set_var "$GITHUB_REPOSITORY" CONTINUUM_ROLE parent

          export CONTINUUM_ENGINE_ROOT="$PWD/.continuum-engine"
          resolver="$CONTINUUM_ENGINE_ROOT/.github/scripts/delegation_repository.sh"
          plan="$(PARENT_CONFIG=.continuum.yml CHILD_REPOSITORIES="" bash "$resolver" plan)"
          count=0
          while IFS= read -r row; do
            [[ -n "$row" ]] || continue
            child_id="$(jq -r '.id' <<<"$row")"
            child_repo="$(jq -r '.repository' <<<"$row")"
            set_var "$child_repo" CONTINUUM_ROLE child
            PARENT_CONFIG=.continuum.yml CHILD_REPOSITORIES=""               bash "$resolver" verify "$child_id" "$child_repo" >/dev/null
            count=$((count + 1))
          done < <(jq -c '.[]' <<<"$plan")

          echo "Verified delegation roles normalized for $count configured child relationship(s)."
