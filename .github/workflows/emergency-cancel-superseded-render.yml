name: Emergency cancel superseded Render runs

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded runs if still active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run_id in 37199711994 37199750530; do
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status')"
            case "$status" in
              queued|in_progress|pending|requested|waiting)
                gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null
                echo "Cancellation requested for run $run_id."
                ;;
              *)
                echo "Run $run_id already terminal ($status)."
                ;;
            esac
          done
