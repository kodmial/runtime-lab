name: Child dispatcher

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .continuum.yml
      - .github/workflows/child-dispatcher.yml
      - .github/workflows/child-worker.yml
      - .github/workflows/child-review.yml
  schedule:
    - cron: '*/10 * * * *'
  workflow_run:
    workflows:
      - Child task
      - Child review
      - Worker task
      - Worker review
    types:
      - completed

permissions:
  contents: read
  actions: write

concurrency:
  group: continuum-child-dispatcher
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.TAP_PAT }}
    steps:
      - name: Remove completed public child runtime metadata
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100"             --jq '.workflow_runs[]
              | select(.status == "completed")
              | select(
                  .name == "Child task" or
                  .name == "Child review" or
                  .name == "Child dispatcher" or
                  .name == "Worker task" or
                  .name == "Worker review" or
                  .name == "Worker dispatcher"
                )
              | .id' |
          while IFS= read -r run_id; do
            [[ -n "$run_id" ]] || continue
            [[ "$run_id" == "$GITHUB_RUN_ID" ]] && continue
            gh api --method DELETE               "repos/$GITHUB_REPOSITORY/actions/runs/$run_id"               >/dev/null 2>&1 || true
          done

  dispatch:
    needs: cleanup
    uses: kodmial/continuum/.github/workflows/consumer-child-dispatcher.yml@28ae5e18b9c6648079078b78bc6aee403adb3b37
    with:
      worker_workflow: child-worker.yml
      review_workflow: child-review.yml
      engine_ref: 28ae5e18b9c6648079078b78bc6aee403adb3b37
    secrets:
      CHILD_RUNTIME_TOKEN: ${{ secrets.TAP_PAT }}
