name: Normalize delegated child-a relationship

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Continuum relationship verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kodmial/continuum
          ref: main
          path: .continuum-engine
          persist-credentials: false

      - name: Normalize one opaque child binding
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          TARGET_CHILD_ID: child-a
          TARGET_TASK: "124"
          TARGET_PR: "127"
        run: |
          set -euo pipefail

          set_var() {
            local repo="$1" name="$2" value="$3"
            if gh api "repos/$repo/actions/variables/$name" >/dev/null 2>&1; then
              gh api --method PATCH "repos/$repo/actions/variables/$name" -f value="$value" >/dev/null
            else
              gh api --method POST "repos/$repo/actions/variables" -f name="$name" -f value="$value" >/dev/null
            fi
          }

          matches=()
          page=1
          while :; do
            repos="$(gh api "/user/repos?affiliation=owner&per_page=100&page=$page" --jq '.[].full_name')"
            [[ -n "$repos" ]] || break
            while IFS= read -r repo; do
              [[ -n "$repo" ]] || continue

              vars="$(gh api "repos/$repo/actions/variables?per_page=100" 2>/dev/null || echo '{"variables":[]}')"
              declared_id="$(jq -r --arg name CONTINUUM_CHILD_ID '[.variables[]? | select(.name == $name) | .value][0] // ""' <<<"$vars")"
              if [[ "$declared_id" == "$TARGET_CHILD_ID" ]]; then
                matches+=("$repo")
                continue
              fi

              pr="$(gh api "repos/$repo/pulls/$TARGET_PR" 2>/dev/null || true)"
              if [[ -n "$pr" ]] &&
                 [[ "$(jq -r '.head.ref // ""' <<<"$pr")" == continuum-child/task-${TARGET_TASK}-* ]]; then
                matches+=("$repo")
              fi
            done <<<"$repos"
            count="$(wc -l <<<"$repos" | tr -d ' ')"
            [[ "$count" -lt 100 ]] && break
            page=$((page + 1))
          done

          unique="$(
            printf '%s\n' "${matches[@]:-}" |
              sed '/^$/d' |
              sort -u
          )"
          unique_count="$(printf '%s\n' "$unique" | sed '/^$/d' | wc -l | tr -d ' ')"
          [[ "$unique_count" == "1" ]] || {
            echo "::error::Expected exactly one repository for the opaque child binding."
            exit 2
          }
          child_repo="$unique"

          set_var "$GITHUB_REPOSITORY" CONTINUUM_ROLE parent
          set_var "$child_repo" CONTINUUM_ROLE child
          set_var "$child_repo" CONTINUUM_CHILD_ID "$TARGET_CHILD_ID"
          set_var "$child_repo" CONTINUUM_PARENT "$GITHUB_REPOSITORY"

          export CONTINUUM_ENGINE_ROOT="$PWD/.continuum-engine"
          resolver="$CONTINUUM_ENGINE_ROOT/.github/scripts/delegation_repository.sh"
          PARENT_CONFIG=.continuum.yml CHILD_REPOSITORIES=""             bash "$resolver" verify "$TARGET_CHILD_ID" "$child_repo" >/dev/null

          echo "Normalized and verified one opaque delegated child relationship."
