name: Verify Render API

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.issue.title == '[probe] verify Render API'
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: Verify Render API and print safe account metadata
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "RENDER_API_KEY_MISSING"
            exit 2
          fi

          owners_status=$(curl -sS -o /tmp/owners.json -w '%{http_code}' \
            'https://api.render.com/v1/owners?limit=20' \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer $RENDER_API_KEY")

          echo "OWNERS_HTTP_STATUS=$owners_status"
          if [ "$owners_status" != "200" ]; then
            jq -c . /tmp/owners.json || cat /tmp/owners.json
            exit 3
          fi

          echo "WORKSPACES_BEGIN"
          jq -c '
            .[] |
            (.owner // .) |
            {
              id: (.id // .ownerId // .owner_id),
              name: (.name // null),
              email: (.email // null),
              type: (.type // null)
            }
          ' /tmp/owners.json
          echo "WORKSPACES_END"

          services_status=$(curl -sS -o /tmp/services.json -w '%{http_code}' \
            'https://api.render.com/v1/services?limit=20' \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer $RENDER_API_KEY")

          echo "SERVICES_HTTP_STATUS=$services_status"
          if [ "$services_status" = "200" ]; then
            echo "SERVICES_BEGIN"
            jq -c '
              .[] |
              (.service // .) |
              {
                id: (.id // null),
                name: (.name // null),
                type: (.type // null),
                ownerId: (.ownerId // .owner_id // null),
                suspended: (.suspended // null)
              }
            ' /tmp/services.json
            echo "SERVICES_END"
          else
            jq -c . /tmp/services.json || cat /tmp/services.json
            exit 4
          fi
