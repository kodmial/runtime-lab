name: Bootstrap Continuum child binding

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .continuum.yml
      - .github/workflows/bootstrap-child-binding.yml

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.TAP_PAT }}
      GITHUB_TOKEN: ${{ secrets.TAP_PAT }}
    steps:
      - name: Discover declared child and store secret binding
        shell: bash
        run: |
          set -euo pipefail

          desired_id="kodmai"
          desired_parent="$GITHUB_REPOSITORY"
          found=""

          while IFS= read -r candidate; do
            [[ -n "$candidate" ]] || continue
            config="$(
              gh api "repos/$candidate/contents/.continuum.yml" --jq '.content' 2>/dev/null                 | tr -d '\n' | base64 -d 2>/dev/null || true
            )"
            [[ -n "$config" ]] || continue

            role="$(sed -nE 's/^[[:space:]]*role:[[:space:]]*([^#[:space:]]+).*/\1/p' <<<"$config" | head -n1)"
            child_id="$(sed -nE 's/^[[:space:]]*id:[[:space:]]*([^#[:space:]]+).*/\1/p' <<<"$config" | head -n1)"
            parent="$(sed -nE 's/^[[:space:]]*parent:[[:space:]]*([^#[:space:]]+).*/\1/p' <<<"$config" | head -n1)"

            if [[ "$role" == "child" &&
                  "$child_id" == "$desired_id" &&
                  "$parent" == "$desired_parent" ]]; then
              [[ -z "$found" ]] || {
                echo "::error::More than one repository declares the same child relationship."
                exit 2
              }
              found="$candidate"
            fi
          done < <(
            gh api --paginate '/user/repos?affiliation=owner&per_page=100'               --jq '.[].full_name'
          )

          [[ -n "$found" ]] || {
            echo "::error::No repository declares the configured child relationship."
            exit 3
          }

          binding="$(jq -cn --arg repo "$found" '{"kodmai":$repo}')"
          gh secret set CONTINUUM_CHILD_REPOSITORIES             --repo "$GITHUB_REPOSITORY"             --body "$binding"

          gh secret list --repo "$GITHUB_REPOSITORY" --json name             --jq '.[].name' | grep -Fxq CONTINUUM_CHILD_REPOSITORIES

          echo "Continuum child binding secret is configured."
