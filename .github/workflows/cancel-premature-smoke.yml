name: Cancel premature smoke run

on:
  push:
    paths:
      - '.github/workflows/cancel-premature-smoke.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel premature OpenCode run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST repos/kodmial/runtime-lab/actions/runs/36372653025/cancel
