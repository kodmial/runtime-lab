name: Worker review
run-name: Worker review #${{ inputs.task_number }}

on:
  workflow_dispatch:
    inputs:
      task_number:
        description: Private task number
        required: true
        type: string
      pr_number:
        description: Private pull request number
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: worker-review-${{ inputs.task_number }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.TAP_PAT }}
      GITHUB_TOKEN: ${{ secrets.TAP_PAT }}
      TASK_NUMBER: ${{ inputs.task_number }}
      PR_NUMBER: ${{ inputs.pr_number }}
      OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}
      OPENCODE_CONFIG_CONTENT: '{"permission":{"bash":{"*":"allow","git *":"allow","git push *":"deny"}}}'
      MAX_REVIEW_PASSES: "3"
    steps:
      - name: Checkout control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Review and repair worker task
        shell: bash
        run: bash automation/private_review.sh
