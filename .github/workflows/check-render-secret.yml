name: Check Render secret

on:
  push:
    paths:
      - '.github/workflows/check-render-secret.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret presence
        env:
          PRESENT: ${{ secrets.RENDER_API_KEY != '' }}
        run: echo "present=$PRESENT"
