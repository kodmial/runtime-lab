name: Auto-merge reviewed pull requests

on:
  # Successful PR CI explicitly dispatches this reconciler from
  # mark-ready-for-coderabbit. CodeRabbit status/review and main pushes are
  # additional event-driven wake-ups; no critical transition depends on cron.
  pull_request_review:
    types: [submitted, dismissed]
  status:
  push:
    branches: [main]
  schedule:
    # Best-effort safety net only. All normal transitions have event hooks.
    # A scheduled run executes the exact same idempotent latest-state
    # reconciler, so overlap with an event-driven wake-up is harmless.
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      post_merge_wakeups:
        description: >-
          Comma-separated workflow file names to wake after a successful merge.
          Leave empty (the default) to wake nothing.
        required: false
        type: string
      post_merge_wakeup_ref:
        description: Git ref the post-merge wake-ups are dispatched at
        required: false
        type: string

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  statuses: read

jobs:
  call:
    uses: kodmial/continuum/.github/workflows/continuum-auto-merge.yml@main
    secrets: inherit
    with:
      continuum_ref: "main"
      post_merge_wakeups: "${{ inputs.post_merge_wakeups }}"
      post_merge_wakeup_ref: "${{ inputs.post_merge_wakeup_ref }}"
