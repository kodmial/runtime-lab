name: Temporary AA bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-aa-temp.yml'

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.TAP_PAT }}
      TARGET_REPO: kodmial/aa
      CONTINUUM_REF: main
    steps:
      - name: Bootstrap public consumer
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo '::error::TAP_PAT is not configured in runtime-lab.'
            exit 1
          fi

          if gh repo view "$TARGET_REPO" --json nameWithOwner,visibility,defaultBranchRef >/tmp/target.json 2>/dev/null; then
            visibility="$(jq -r '.visibility' /tmp/target.json)"
            [[ "$visibility" == "PUBLIC" ]] || { echo '::error::Target repository exists but is not public.'; exit 2; }
          else
            gh api --method POST user/repos \
              -f name='aa' \
              -f description='AA Telegram bot.' \
              -F private=false \
              -F has_issues=true \
              -F has_projects=false \
              -F has_wiki=false \
              -F auto_init=true >/dev/null
          fi

          visibility="$(gh repo view "$TARGET_REPO" --json visibility --jq '.visibility')"
          [[ "$visibility" == "PUBLIC" ]] || { echo '::error::Public visibility verification failed.'; exit 3; }

          gh auth setup-git
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          git clone --quiet --depth 1 --branch main https://github.com/kodmial/continuum.git "$work/continuum"
          git clone --quiet "https://github.com/$TARGET_REPO.git" "$work/target"

          current_branch="$(git -C "$work/target" branch --show-current)"
          if [[ "$current_branch" != "main" ]]; then
            git -C "$work/target" branch -m main
            git -C "$work/target" push --quiet -u origin main
            gh api --method PATCH "repos/$TARGET_REPO" -f default_branch=main >/dev/null
            if git -C "$work/target" ls-remote --exit-code --heads origin "$current_branch" >/dev/null 2>&1; then
              git -C "$work/target" push --quiet origin --delete "$current_branch"
            fi
          fi

          bash "$work/continuum/install.sh" "$work/target" "$CONTINUUM_REF" core --yes

          cat > "$work/target/.continuum.yml" <<'EOF'
          version: 1
          EOF

          cat > "$work/target/.gitignore" <<'EOF'
          /vendor/
          /.env
          /.env.*
          !/.env.example
          /storage/*.key
          /node_modules/
          /.phpunit.cache/
          EOF

          cat > "$work/target/README.md" <<'EOF'
          # AA

          Public repository for the AA Telegram bot.

          Continuum core is installed from and intentionally tracks `kodmial/continuum@main`.
          Application bootstrap is handled by Work Lock #47.
          EOF

          bad_refs="$(grep -RInE 'kodmial/continuum/.github/workflows/.*@(?!main)' "$work/target/.github/workflows" 2>/dev/null || true)"
          if [[ -n "$bad_refs" ]]; then
            echo '::error::Found Continuum workflow references not tracking main.'
            exit 4
          fi
          if grep -RInE '^([[:space:]]*)(continuum_ref|engine_ref):[[:space:]]+[^"'"']*' "$work/target/.github/workflows" >/dev/null 2>&1; then
            :
          fi

          gh variable set CONTINUUM_REVIEW_PROVIDER --repo "$TARGET_REPO" --body 'none'
          actual="$(gh variable get CONTINUUM_REVIEW_PROVIDER --repo "$TARGET_REPO")"
          [[ "$actual" == 'none' ]] || { echo '::error::Variable verification failed.'; exit 5; }

          printf '%s' "$GH_TOKEN" | gh secret set TAP_PAT --repo "$TARGET_REPO"
          gh secret list --repo "$TARGET_REPO" --json name --jq '.[].name' | grep -Fxq TAP_PAT || { echo '::error::Secret verification failed.'; exit 6; }

          git -C "$work/target" config user.name 'kodmial'
          git -C "$work/target" config user.email 'kodmial@gmail.com'
          git -C "$work/target" add .
          if ! git -C "$work/target" diff --cached --quiet; then
            git -C "$work/target" commit --quiet -m 'chore: bootstrap Continuum consumer'
            git -C "$work/target" push --quiet origin main
          fi

          [[ "$(gh repo view "$TARGET_REPO" --json visibility --jq '.visibility')" == 'PUBLIC' ]]
          [[ "$(gh repo view "$TARGET_REPO" --json defaultBranchRef --jq '.defaultBranchRef.name')" == 'main' ]]
          test -f "$work/target/.github/workflows/continuum-issue-scheduler.yml"
          grep -Rqs 'kodmial/continuum/.github/workflows/.*@main' "$work/target/.github/workflows"
          echo 'Bootstrap completed successfully.'
