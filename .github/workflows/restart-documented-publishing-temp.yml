name: Restart issue runs on documented-safe publishing

on:
  push:
    paths:
      - '.github/workflows/restart-documented-publishing-temp.yml'

permissions:
  actions: write
  issues: write
  contents: read

jobs:
  restart:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel stale publishing runs
        shell: bash
        run: |
          set -euo pipefail
          for run in 36375541601 36375603544; do
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run/force-cancel" >/dev/null 2>&1 || true
          done

      - name: Re-dispatch issue 1 and audit 14
        shell: bash
        run: |
          set -euo pipefail
          for issue in 1 14; do
            gh issue edit "$issue" --repo "$GITHUB_REPOSITORY"               --remove-label "automation:paused" >/dev/null 2>&1 || true
            gh issue edit "$issue" --repo "$GITHUB_REPOSITORY"               --add-label "automation:in-progress" >/dev/null
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY"               --body "Recovery dispatch using documented-safe branch publication from the current main ref."
            gh workflow run opencode.yml --repo "$GITHUB_REPOSITORY" --ref main               -f mode=issue -f issue_number="$issue"
          done
