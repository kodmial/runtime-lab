name: Issue scheduler

on:
  workflow_dispatch:
  # Event-driven wake-up for human/PAT/App pushes to main. Automated merges
  # also dispatch this workflow explicitly because GITHUB_TOKEN suppresses
  # most follow-up workflow events.
  push:
    branches: [main]
  schedule:
    # Safety net only; normal progress should not depend on cron.
    # Offset from :00 to reduce GitHub scheduler load/drop risk.
    - cron: "7,22,37,52 * * * *"
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]
  pull_request_target:
    types: [closed]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: runtime-lab-issue-scheduler
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WIP_LIMIT: '6'
      LEASE_MINUTES: ${{ vars.AUTOMATION_LEASE_MINUTES || '90' }}
      MAX_DISPATCH_ATTEMPTS: ${{ vars.AUTOMATION_MAX_DISPATCH_ATTEMPTS || '4' }}

    steps:
      - name: Reconcile state and dispatch ready issues
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            function positiveInt(name, fallback) {
              const raw = process.env[name] || String(fallback);
              const value = Number.parseInt(raw, 10);
              if (!Number.isInteger(value) || value <= 0) {
                throw new Error(name + ' must be a positive integer; got ' + raw);
              }
              return value;
            }

            const wipLimit = positiveInt('WIP_LIMIT', 6);
            const leaseMinutes = positiveInt('LEASE_MINUTES', 90);
            const maxAttempts = positiveInt('MAX_DISPATCH_ATTEMPTS', 4);
            const leaseMs = leaseMinutes * 60 * 1000;

            const priorities = ['priority:p0', 'priority:p1', 'priority:p2'];
            const rank = new Map(priorities.map((name, i) => [name, i]));
            const inProgress = 'automation:in-progress';
            const paused = 'automation:paused';
            const marker = '<!-- runtime-lab-scheduler-dispatch -->';
            const pauseMarker = '<!-- runtime-lab-scheduler-pause -->';
            const repairResetMarker = '<!-- runtime-lab-render-repair-reset -->';
            const qualificationResetMarker = '<!-- runtime-lab-qualification-reset -->';
            const publicationConflictResetMarker = '<!-- runtime-lab-publication-conflict-reset -->';
            const renderSmoke = 'execution:render-smoke';
            const renderE2E = 'execution:render-e2e';
            const dockerQualify = 'execution:docker-qualify';

            let executionBackend = 'actions';
            try {
              const {data: configFile} = await github.rest.repos.getContent({
                owner, repo, path: 'automation/control-plane.json', ref: 'main',
              });
              if (Array.isArray(configFile) || !configFile.content) {
                throw new Error('automation/control-plane.json is not a regular file');
              }
              const config = JSON.parse(
                Buffer.from(configFile.content, 'base64').toString('utf8')
              );
              executionBackend = config.execution_backend || 'actions';
            } catch (err) {
              if (err.status !== 404) throw err;
            }

            if (!['actions', 'render-controller'].includes(executionBackend)) {
              throw new Error(
                'Unsupported execution_backend in automation/control-plane.json: ' +
                executionBackend
              );
            }

            if (executionBackend === 'render-controller') {
              core.notice(
                'Direct Render controller is active; Actions issue dispatch is disabled.'
              );
              return;
            }

            const labelSpecs = [
              ['priority:p0', 'B60205', 'P0 — critical work.'],
              ['priority:p1', 'D93F0B', 'P1 — high-priority planned work.'],
              ['priority:p2', 'FBCA04', 'P2 — normal planned work.'],
              [inProgress, '1D76DB', 'Reserved or actively handled by automation.'],
              [paused, '6A737D', 'Automation stopped after repeated failed dispatches.'],
              [renderSmoke, '5319E7', 'Execute this ready issue through the Render smoke controller.'],
              [renderE2E, '0052CC', 'Execute this ready issue through the Render end-to-end controller.'],
              ['qualification:render', '8250DF', 'Persist and classify this Render run as a qualification result.'],
              [dockerQualify, '0E8A16', 'Execute this reusable issue through the exact-artifact Docker qualifier.'],
            ];
            for (const [name, color, description] of labelSpecs) {
              try {
                await github.rest.issues.createLabel({owner, repo, name, color, description});
              } catch (err) {
                if (err.status !== 422) throw err;
              }
            }

            const issues = (await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            })).filter(issue => !issue.pull_request);

            const labels = new Map(
              issues.map(issue => [
                issue.number,
                new Set((issue.labels || []).map(label =>
                  typeof label === 'string' ? label : label.name
                )),
              ])
            );

            async function addLabel(number, name) {
              if (labels.get(number)?.has(name)) return;
              await github.rest.issues.addLabels({
                owner, repo, issue_number: number, labels: [name],
              });
              labels.get(number)?.add(name);
            }

            async function removeLabel(number, name) {
              if (!labels.get(number)?.has(name)) return;
              try {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: number, name,
                });
              } catch (err) {
                if (err.status !== 404) throw err;
              }
              labels.get(number)?.delete(name);
            }

            // Migrate the P0/P1/P2 prefix already used by runtime-lab issues
            // into scheduler labels so the ordering remains deterministic.
            for (const issue of issues) {
              const current = [...labels.get(issue.number)].filter(x => rank.has(x));
              if (current.length) continue;
              const text = issue.title + '\n' + (issue.body || '');
              const match = text.match(/(?:^|\n)\s*(?:##\s*Priority\s*\n\s*)?P([0-2])\b/i);
              if (match) await addLabel(issue.number, 'priority:p' + match[1]);
            }

            const allPrs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'all', per_page: 100,
            });

            const prsByIssue = new Map();
            for (const pr of allPrs) {
              const match = (pr.head.ref || '').match(/^opencode\/issue(\d+)-/);
              if (!match) continue;
              const issueNumber = Number(match[1]);
              if (!prsByIssue.has(issueNumber)) prsByIssue.set(issueNumber, []);
              prsByIssue.get(issueNumber).push(pr);
            }

            const active = new Set();
            for (const issue of issues) {
              const prs = (prsByIssue.get(issue.number) || [])
                .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
              const openPr = prs.find(pr => pr.state === 'open');
              if (openPr) {
                active.add(issue.number);
                await addLabel(issue.number, inProgress);
                continue;
              }

              const mergedPr = prs.find(pr => pr.merged_at);
              if (mergedPr) {
                await removeLabel(issue.number, inProgress);
                try {
                  await github.rest.issues.update({
                    owner, repo, issue_number: issue.number,
                    state: 'closed', state_reason: 'completed',
                  });
                } catch (_) {}
                continue;
              }

              if (!labels.get(issue.number).has(inProgress)) continue;

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: issue.number, per_page: 100,
              });
              const resetAt = comments
                .filter(comment =>
                  (comment.body || '').includes(repairResetMarker) ||
                  (comment.body || '').includes(qualificationResetMarker) ||
                  (comment.body || '').includes(publicationConflictResetMarker)
                )
                .map(comment => new Date(comment.created_at).getTime())
                .sort((a, b) => b - a)[0] || 0;
              const dispatches = comments
                .filter(comment =>
                  (comment.body || '').includes(marker) &&
                  new Date(comment.created_at).getTime() >= resetAt
                )
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              const latest = dispatches[0];
              if (!latest) {
                await removeLabel(issue.number, inProgress);
                continue;
              }

              // Match NanoDictate's authoritative PR-close semantics. If the
              // latest PR for this dispatch was explicitly closed without
              // merge, do not silently reopen work after the lease expires.
              const latestPr = prs[0] || null;
              if (
                latestPr &&
                latestPr.state === 'closed' &&
                !latestPr.merged_at &&
                new Date(latestPr.created_at).getTime() >=
                  new Date(latest.created_at).getTime()
              ) {
                await removeLabel(issue.number, inProgress);
                await addLabel(issue.number, paused);
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: pauseMarker + '\nOpenCode PR #' + latestPr.number +
                    ' was closed without merge; automation paused to avoid creating a replacement PR.',
                });
                continue;
              }

              const age = Date.now() - new Date(latest.created_at).getTime();
              if (age < leaseMs) {
                active.add(issue.number);
                continue;
              }

              if (dispatches.length >= maxAttempts) {
                await removeLabel(issue.number, inProgress);
                await addLabel(issue.number, paused);
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: pauseMarker + '\nAutomation paused after ' + dispatches.length +
                    ' dispatch attempts without an open PR. Remove `automation:paused` to retry.',
                });
              } else {
                await removeLabel(issue.number, inProgress);
              }
            }

            const freeSlots = Math.max(0, wipLimit - active.size);
            core.info('WIP: ' + active.size + '/' + wipLimit + '; free slots: ' + freeSlots);
            if (!freeSlots) return;

            const candidates = [];
            for (const issue of issues) {
              const set = labels.get(issue.number);
              if (set.has(paused) || active.has(issue.number)) continue;

              const issuePriorities = [...set]
                .filter(name => rank.has(name))
                .sort((a, b) => rank.get(a) - rank.get(b));

              // Only explicitly prioritized work enters the automatic queue.
              // Issues without priority:p0/p1/p2 remain untouched until a
              // priority is assigned (or inferred above from an explicit
              // P0/P1/P2 declaration in the issue text).
              if (issuePriorities.length === 0) {
                core.info(
                  'Skipping #' + issue.number +
                  ': no priority:p0/p1/p2 label.'
                );
                continue;
              }

              const p = issuePriorities[0];
              candidates.push({issue, priority: p, rank: rank.get(p)});
            }
            candidates.sort((a, b) => a.rank - b.rank || a.issue.number - b.issue.number);

            const selected = [];
            for (const candidate of candidates) {
              if (selected.length >= freeSlots) break;
              let blockers = [];
              try {
                const {data} = await github.request(
                  'GET /repos/{owner}/{repo}/issues/{issue_number}/dependencies/blocked_by',
                  {
                    owner, repo, issue_number: candidate.issue.number,
                    headers: {'X-GitHub-Api-Version': '2022-11-28'},
                  }
                );
                blockers = Array.isArray(data) ? data : (data.blocked_by || []);
              } catch (err) {
                if (err.status !== 404) throw err;
              }
              const openBlockers = blockers.filter(item => item.state === 'open');

              // runtime-lab's bootstrap issues already encode their prerequisite
              // DAG in Definition of Ready ("#N is completed"). Honor those
              // references as a fallback until/native GitHub issue dependencies
              // are populated, so parallel WIP cannot start dependent work early.
              const readinessDependencyNumbers = [
                ...new Set(
                  [...(candidate.issue.body || '').matchAll(/#(\d+)\s+is completed\b/gi)]
                    .map(match => Number(match[1]))
                    .filter(number =>
                      Number.isInteger(number) &&
                      number > 0 &&
                      number !== candidate.issue.number
                    )
                ),
              ];

              for (const dependencyNumber of readinessDependencyNumbers) {
                if (openBlockers.some(item => item.number === dependencyNumber)) continue;
                try {
                  const {data: dependency} = await github.rest.issues.get({
                    owner, repo, issue_number: dependencyNumber,
                  });
                  if (dependency.state === 'open' && !dependency.pull_request) {
                    openBlockers.push(dependency);
                  }
                } catch (err) {
                  if (err.status !== 404) throw err;
                }
              }

              if (openBlockers.length) {
                core.info('Skipping #' + candidate.issue.number + ': blocked by ' +
                  openBlockers.map(item => '#' + item.number).join(', '));
                continue;
              }
              selected.push(candidate);
            }

            for (const {issue, priority} of selected) {
              await addLabel(issue.number, inProgress);
              const previous = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: issue.number, per_page: 100,
              });
              const resetAt = previous
                .filter(c =>
                  (c.body || '').includes(repairResetMarker) ||
                  (c.body || '').includes(qualificationResetMarker) ||
                  (c.body || '').includes(publicationConflictResetMarker)
                )
                .map(c => new Date(c.created_at).getTime())
                .sort((a, b) => b - a)[0] || 0;
              const attempt = previous.filter(c =>
                (c.body || '').includes(marker) &&
                new Date(c.created_at).getTime() >= resetAt
              ).length + 1;

              if (attempt > maxAttempts) {
                await removeLabel(issue.number, inProgress);
                await addLabel(issue.number, paused);
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: pauseMarker + '\nAutomation paused before dispatch attempt ' + attempt +
                    ': maximum of ' + maxAttempts + ' attempts already reached.',
                });
                continue;
              }

              try {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: marker + '\nDispatch attempt ' + attempt + ' (' +
                    (priority || 'no explicit priority') + ').',
                });
                const issueLabels = labels.get(issue.number);
                const renderMode = issueLabels.has(renderSmoke)
                  ? 'smoke'
                  : (issueLabels.has(renderE2E) ? 'e2e' : null);

                if (renderMode) {
                  await github.rest.actions.createWorkflowDispatch({
                    owner, repo, workflow_id: 'render-executor.yml', ref: 'main',
                    inputs: {
                      mode: renderMode,
                      issue_number: String(issue.number),
                    },
                  });
                  core.notice(
                    'Dispatched issue #' + issue.number +
                    ' to Render executor (' + renderMode + ').'
                  );
                } else if (issueLabels.has(dockerQualify)) {
                  await github.rest.actions.createWorkflowDispatch({
                    owner, repo, workflow_id: 'docker-qualification.yml', ref: 'main',
                    inputs: {issue_number: String(issue.number)},
                  });
                  core.notice(
                    'Dispatched issue #' + issue.number +
                    ' to the reusable Docker qualification workflow.'
                  );
                } else {
                  await github.rest.actions.createWorkflowDispatch({
                    owner, repo, workflow_id: 'opencode.yml', ref: 'main',
                    inputs: {mode: 'issue', issue_number: String(issue.number)},
                  });
                  core.notice('Dispatched issue #' + issue.number + ' to OpenCode.');
                }
              } catch (err) {
                await removeLabel(issue.number, inProgress);
                throw err;
              }
            }
